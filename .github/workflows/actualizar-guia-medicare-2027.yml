name: Actualizar guia Medicare a 2027

on: push

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar cifras 2027 a la guia de Medicare
        run: |
          cat > /tmp/med27.py <<'PYEOF'
          import re, sys, json, io
          F = "guia-medicare-espanol.html"
          s = open(F, encoding="utf-8").read()
          if "<title>Guía de Medicare en Español 2027</title>" in s:
              print("YA ESTABA — la guia ya esta en 2027, no se toca nada")
              raise SystemExit(0)
          orig = s
          R = []

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  sys.exit("ERROR %s: aparece %d veces (esperaba 1)" % (label, n))
              s = s.replace(old, new, 1)
              R.append(label)

          # 1. title
          rep("<title>Guía de Medicare en Español 2026</title>",
              "<title>Guía de Medicare en Español 2027</title>", "title")

          # 2. meta description
          rep('content="Qué es Medicare, quién califica, cuándo inscribirse y cuánto cuesta en 2026: Partes A, B, C y D, Advantage vs. Original y ayudas."',
              'content="Qué es Medicare, quién califica, cuándo inscribirse y cuánto cuesta en 2027: Partes A, B, C y D, Advantage vs. Original y ayudas."',
              "meta description")

          # 3. og:title
          rep('content="¿Cómo Funciona Medicare en Español? Guía Completa 2026"',
              'content="¿Cómo Funciona Medicare en Español? Guía Completa 2027"', "og:title")

          # 4. og:description
          rep("cuánto cuesta en 2026 y qué ayudas existen",
              "cuánto cuesta en 2027 y qué ayudas existen", "og:description")

          # 5. JSON-LD headline
          rep('"headline": "¿Cómo funciona Medicare en español? Guía completa 2026"',
              '"headline": "¿Cómo funciona Medicare en español? Guía completa 2027"', "headline JSON-LD")

          # 6. dateModified
          rep('"dateModified": "2026-08-17"', '"dateModified": "2026-10-12"', "dateModified")

          # 7. JSON-LD description
          rep("cuándo inscribirse, cuánto cuesta en 2026, Medicare Advantage",
              "cuándo inscribirse, cuánto cuesta en 2027, Medicare Advantage", "descripcion JSON-LD")

          # 8-9. FAQ pregunta + respuesta
          rep('"name": "¿Cuánto cuesta Medicare en 2026?"',
              '"name": "¿Cuánto cuesta Medicare en 2027?"', "FAQ pregunta")

          rep("En la Parte D, el gasto de bolsillo en medicinas tiene un tope de $2,100 al año en 2026.",
              "En la Parte D, para 2027 el gasto de bolsillo en medicinas tiene un tope de $2,400 al año y ningún plan puede cobrar un deducible de medicinas mayor a $700. Las cifras de la Parte A y la Parte B que aparecen aquí son las oficiales de 2026: CMS publica las de 2027 en noviembre y esta guía se actualiza en cuanto salgan.",
              "FAQ respuesta")

          # 10. H1
          rep("en Español? Guía Completa 2026</h1>", "en Español? Guía Completa 2027</h1>", "H1")

          # 11. linea 'updated'
          rep("· Cifras oficiales 2026 · Atención 100% en español",
              "· Parte D con cifras oficiales 2027 · Atención 100% en español", "linea updated")

          # 12. indice
          rep(">4. ¿Cuánto cuesta Medicare en 2026?</a>", ">4. ¿Cuánto cuesta Medicare en 2027?</a>", "indice")

          # 13. H2
          rep('<h2 id="cuanto-cuesta">4. ¿Cuánto cuesta Medicare en 2026?</h2>',
              '<h2 id="cuanto-cuesta">4. ¿Cuánto cuesta Medicare en 2027?</h2>', "H2 costos")

          # 14. parrafo introductorio honesto
          rep("<p>Estas son las cifras oficiales para 2026. Recuerda que el número final depende de tu historial de trabajo, tu ingreso y el plan que elijas.</p>",
              "<p>Las cifras de la <strong>Parte D ya son las oficiales de 2027</strong>. Las de la Parte A y la Parte B que ves abajo son las de <strong>2026</strong>, porque CMS publica las de 2027 en noviembre; en cuanto salgan actualizamos esta guía. El número final siempre depende de tu historial de trabajo, tu ingreso y el plan que elijas.</p>",
              "parrafo costos")

          # 15. filas de la tabla con el año visible
          rep("<td><strong>Parte A</strong> (hospital)</td><td>Gratis para la mayoría. Si te faltan trimestres: $311 (30–39 trimestres) o $565 (menos de 30).</td><td>$1,736 por período de beneficio en el hospital.</td>",
              "<td><strong>Parte A</strong> (hospital)<br><small>cifra 2026</small></td><td>Gratis para la mayoría. Si te faltan trimestres: $311 (30–39 trimestres) o $565 (menos de 30).</td><td>$1,736 por período de beneficio en el hospital.</td>",
              "fila Parte A")

          rep("<td><strong>Parte B</strong> (médico)</td><td><strong>$202.90</strong> (prima estándar; más si tu ingreso es alto).</td>",
              "<td><strong>Parte B</strong> (médico)<br><small>cifra 2026</small></td><td><strong>$202.90</strong> (prima estándar; más si tu ingreso es alto).</td>",
              "fila Parte B")

          rep("<td><strong>Parte C</strong> (Advantage)</td><td>Muchos planes con <strong>$0</strong> adicional (sigues pagando tu Parte B).</td>",
              "<td><strong>Parte C</strong> (Advantage)<br><small>cifra 2027</small></td><td>Muchos planes con <strong>$0</strong> adicional (sigues pagando tu Parte B). La prima promedio de un plan Advantage en 2027 es de <strong>$12</strong> al mes.</td>",
              "fila Parte C")

          rep("<td><strong>Parte D</strong> (medicinas)</td><td>Varía según el plan.</td><td>Tope de gasto de bolsillo en medicinas: <strong>$2,100</strong> al año.</td>",
              "<td><strong>Parte D</strong> (medicinas)<br><small>cifra 2027</small></td><td>Varía según el plan. La prima promedio de un plan de medicinas en 2027 es de <strong>$36</strong> al mes.</td><td>Tope de gasto de bolsillo en medicinas: <strong>$2,400</strong> al año. Ningún plan puede cobrar un deducible de medicinas mayor a <strong>$700</strong>.</td>",
              "fila Parte D")

          # 16. descargo
          rep("Contenido informativo en español sobre Medicare con cifras oficiales de CMS para 2026;",
              "Contenido informativo en español sobre Medicare con cifras oficiales de CMS: las de la Parte D corresponden a 2027 y las de la Parte A y la Parte B a 2026, a la espera de que CMS publique las de 2027 en noviembre;",
              "descargo")

          # --------- REVISION FINAL ---------
          errs = []
          if "$2,100" in s: errs.append("quedo un $2,100 (tope viejo de Parte D)")
          if "Guía Completa 2026" in s or "Guía completa 2026" in s: errs.append("quedo un titulo 2026")
          if s.count("$2,400") < 2: errs.append("falta el tope $2,400 en algun lado")
          if "$700" not in s: errs.append("falta el deducible maximo $700")
          for must in ["$202.90", "$283", "$1,736", "$311", "$565"]:
              if must not in s: errs.append("se perdio la cifra " + must)
          # etiquetas balanceadas
          for tag in ["table", "tr", "td", "section", "p"]:
              a = len(re.findall(r"<%s[ >]" % tag, s)); b = len(re.findall(r"</%s>" % tag, s))
              if tag in ("table", "tr", "td") and a != b:
                  errs.append("tags %s desbalanceados: %d/%d" % (tag, a, b))
          # JSON-LD parsea
          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', s, re.S):
              try: json.loads(m.group(1))
              except Exception as e: errs.append("JSON-LD roto: %s" % e)
          # title y description dentro de limites
          mt = re.search(r"<title>([^<]*)</title>", s)
          md = re.search(r'<meta name="description" content="([^"]*)"', s)
          if mt and len(mt.group(1)) > 60: errs.append("title %d chars (>60)" % len(mt.group(1)))
          if md and len(md.group(1)) > 155: errs.append("description %d chars (>155)" % len(md.group(1)))
          # EmailJS y bloques intactos
          for must in ["BLOQUE-TE-LLAMAMOS-v1", "VIDEO-MEDICARE-v1", "template_tndcul8"]:
              if must not in s: errs.append("se perdio " + must)

          if errs:
              sys.exit("REVISION FALLO:\n- " + "\n- ".join(errs))

          open(F, "w", encoding="utf-8").write(s)
          print("OK — %d cambios" % len(R))
          for r in R: print("  ·", r)
          print("bytes: %d -> %d" % (len(orig), len(s)))
          print("title:", mt.group(1), "(%d)" % len(mt.group(1)))
          print("desc :", len(md.group(1)), "chars")


          # --------- SITEMAP ---------
          import os
          if os.path.exists("sitemap.xml"):
              sm = open("sitemap.xml", encoding="utf-8").read()
              anchor = "<loc>https://greatinsuranceteam.com/guia-medicare-espanol.html</loc>"
              i = sm.find(anchor)
              if i < 0:
                  sys.exit("ERROR: la guia de Medicare no esta en el sitemap")
              j = sm.find("<lastmod>", i); k = sm.find("</lastmod>", j)
              if j < 0 or k < 0 or j > i + 300:
                  sys.exit("ERROR: no encontre el lastmod de la guia de Medicare")
              sm = sm[:j] + "<lastmod>2026-10-12" + sm[k:]
              open("sitemap.xml", "w", encoding="utf-8").write(sm)
              print("sitemap.xml: lastmod de la guia de Medicare -> 2026-10-12")

          PYEOF
          python3 /tmp/med27.py

      - name: Publicar y autoborrar el workflow
        run: |
          rm -f .github/workflows/actualizar-guia-medicare-2027.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nada que publicar" || git commit -m "Guia de Medicare: cifras oficiales 2027 de Parte D, Parte A y B marcadas como 2026"
          git push
