name: oep-banner-2026
on:
  push:
    paths:
      - ".github/workflows/oep-banner-2026.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency: oep-banner-2026
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar banner y seccion de Open Enrollment 2026-2027
        run: |
          cat > /tmp/oep_banner.py <<'PYEOF'
          import re, json
          
          def rd(p): return open(p, encoding="utf-8").read()
          def wr(p, s): open(p, "w", encoding="utf-8").write(s)
          
          idx = rd("index.html")
          llms = rd("llms.txt")
          
          # ---------- 1) NAV: agregar enlace "Open Enrollment" ----------
          NAV_VIEJO = '<ul class="nav-menu">\n    <li><a href="#servicios">Servicios</a></li>'
          NAV_NUEVO = ('<ul class="nav-menu">\n'
                       '    <li><a href="#open-enrollment" style="color:var(--gold2)">Open Enrollment</a></li>\n'
                       '    <li><a href="#servicios">Servicios</a></li>')
          if 'href="#open-enrollment"' not in idx:
              assert idx.count(NAV_VIEJO) == 1, "nav: no encontre el bloque exacto"
              idx = idx.replace(NAV_VIEJO, NAV_NUEVO)
          
          # ---------- 2) URGENCY BAR: mensaje especifico con fechas ----------
          URG_VIEJO = ('<!-- URGENCY -->\n'
                       '<div class="urgency">\n'
                       '  <p>La disponibilidad y los períodos de inscripción dependen de la cobertura. '
                       '<span>Consulta tus opciones con un agente.</span></p>\n'
                       '</div>')
          URG_NUEVO = ('<!-- URGENCY -->\n'
                       '<div class="urgency">\n'
                       '  <p><a href="#open-enrollment" style="color:inherit;text-decoration:underline;text-underline-offset:3px">'
                       'Medicare: la Inscripción Abierta ya empezó (cierra el 7 de diciembre). El Open Enrollment de ACA '
                       'comienza el 1º de noviembre. <span>Agenda tu cita antes de que se llenen los cupos →</span></a></p>\n'
                       '</div>')
          if 'id="open-enrollment"' not in idx:
              assert idx.count(URG_VIEJO) == 1, "urgency: no encontre el bloque exacto"
              idx = idx.replace(URG_VIEJO, URG_NUEVO)
          
          # ---------- 3) NUEVA SECCION: fechas clave Medicare AEP + ACA OEP ----------
          OEP_SECTION = '''
          <!-- OPEN ENROLLMENT 2026-2027 -->
          <section class="oep-sec" id="open-enrollment">
          <style>
          .oep-sec{position:relative;z-index:2;background:var(--navy-mid);padding:70px 6vw}
          .oep-inner{max-width:1100px;margin:0 auto}
          .oep-head{text-align:center;max-width:680px;margin:0 auto 3rem}
          .oep-head h2{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:800;color:var(--white);line-height:1.15;margin-top:.6rem}
          .oep-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
          @media (max-width:820px){.oep-grid{grid-template-columns:1fr}}
          .oep-card{background:var(--navy-card);border:1px solid rgba(196,210,232,.12);border-radius:6px;padding:2rem}
          .oep-badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);background:var(--gold2);padding:5px 12px;border-radius:2px;margin-bottom:1rem}
          .oep-card.is-open .oep-badge{background:var(--red2);color:var(--white)}
          .oep-card h3{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--white);margin-bottom:.5rem}
          .oep-dates{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.04em;color:var(--gold3);font-size:1.05rem;margin-bottom:1rem}
          .oep-card p{color:var(--silver);font-size:.95rem;line-height:1.65;margin-bottom:1.4rem}
          .oep-card .btn-hero{display:inline-block}
          </style>
          <div class="oep-inner">
            <div class="oep-head">
              <p class="sec-label">Fechas Clave 2026 &ndash; 2027</p>
              <h2>Dos ventanas de inscripci&oacute;n.<br>Una sola vez al a&ntilde;o.</h2>
            </div>
            <div class="oep-grid">
              <div class="oep-card is-open">
                <span class="oep-badge">Ya est&aacute; abierta</span>
                <h3>Medicare &mdash; Inscripci&oacute;n Abierta (AEP)</h3>
                <p class="oep-dates">15 de octubre &ndash; 7 de diciembre de 2026</p>
                <p>Si ya tienes Medicare, esta es tu &uacute;nica oportunidad del a&ntilde;o para cambiar de plan Medicare Advantage, volver a Medicare Original o ajustar tu cobertura de medicamentos (Parte D).</p>
                <a href="#te-llamamos" class="btn-hero">Revisar mi plan de Medicare &rarr;</a>
              </div>
              <div class="oep-card">
                <span class="oep-badge">Comienza el 1&ordm; de noviembre</span>
                <h3>ACA / Mercado de Salud &mdash; Open Enrollment</h3>
                <p class="oep-dates">1&ordm; de noviembre de 2026 &ndash; 15 de enero de 2027</p>
                <p>Es el &uacute;nico momento del a&ntilde;o para inscribirte o cambiar tu plan de salud ACA sin necesitar un evento de vida que lo justifique. Inscr&iacute;bete antes del 15 de diciembre para que tu cobertura empiece el 1 de enero.</p>
                <a href="#te-llamamos" class="btn-hero">Explorar mis opciones de ACA &rarr;</a>
              </div>
            </div>
          </div>
          </section>
          <!-- /OPEN ENROLLMENT -->
          
          <!-- FEAR -->'''
          
          if idx.count('<section class="oep-sec"') == 0:
              assert idx.count("<!-- FEAR -->") == 1, "oep: no encontre el marcador <!-- FEAR -->"
              idx = idx.replace("<!-- FEAR -->", OEP_SECTION, 1)
          
          # ---------- 4) llms.txt: fechas clave para IA / crawlers ----------
          LLMS_MARCA = "## Páginas por estado"
          LLMS_BLOQUE = ('## Fechas clave de inscripción (2026–2027)\n\n'
                         '- Medicare, Inscripción Abierta (AEP): 15 de octubre al 7 de diciembre de 2026.\n'
                         '- ACA / Mercado de Seguros Médicos, Open Enrollment: 1 de noviembre de 2026 al 15 de enero de 2027 '
                         '(inscribirse antes del 15 de diciembre para cobertura desde el 1 de enero).\n\n')
          if "## Fechas clave de inscripción" not in llms:
              assert llms.count(LLMS_MARCA) == 1, "llms: no encontre el marcador de paginas por estado"
              llms = llms.replace(LLMS_MARCA, LLMS_BLOQUE + LLMS_MARCA)
          
          wr("index.html", idx)
          wr("llms.txt", llms)
          
          for blk in re.findall(r'<script type="application/ld\+json">([\s\S]*?)</script>', idx):
              json.loads(blk)
          
          assert idx.count('id="open-enrollment"') == 1
          assert idx.count('href="#open-enrollment"') == 2  # nav + urgency bar
          print("OK: banner y seccion de Open Enrollment agregados")
          PYEOF
          echo "0fcf194516dfbe62a98a63f02488d11ca9733b82fb03e7fa8c062af452172015  /tmp/oep_banner.py" | sha256sum -c -
          python3 /tmp/oep_banner.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html llms.txt
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Open Enrollment 2026-2027: banner y seccion de fechas clave en portada"
          git push
      - name: Borrarse a si mismo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oep-banner-2026.yml
          git add -A .github/workflows/oep-banner-2026.yml
          if git diff --cached --quiet; then echo "Nada que borrar"; exit 0; fi
          git commit -m "Quitar workflow oep-banner-2026 (ya se aplico)"
          git push
