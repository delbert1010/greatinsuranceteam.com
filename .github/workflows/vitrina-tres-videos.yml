name: vitrina-tres-videos

on: push

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vitrina con los 3 videos arriba de las guias
        run: |
          cat > /tmp/vitrina.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import sys,os,re,json

          # --- los videos de la vitrina. Para agregar uno nuevo: copiar una linea. ---
          VIDEOS = [
            ("ACA / Obamacare", "video-asesora",  "Este a\xf1o el Mercado cambi\xf3"),
            ("Medicare",        "video-medicare", "\xbfCumples 65 o ya tienes Medicare?"),
            ("Suplementarios",  "video-suplementarios", "Lo que tu seguro de salud no cubre"),
          ]

          CARD = '''<div class="va-item">
          <p class="va-tag">%s</p>
          <div class="va-card">
          <video class="va-player" controls playsinline preload="none" poster="/%s.jpg">
          <source src="/%s.mp4" type="video/mp4">
          Tu navegador no puede reproducir el video.
          </video>
          </div>
          <p class="va-sub">%s</p>
          </div>'''

          tarjetas="\n".join(CARD%(t, "poster-"+n.replace("video-",""), n, d) for t,n,d in VIDEOS)

          BLOQUE = '''<!-- VIDEO-ASESORA-v1 inicio -->
          <section class="va-sec">
          <style>
          .va-sec{background:#1a1a2e;padding:52px 20px 14px;text-align:center;border-top:1px solid rgba(244,196,48,0.15)}
          .va-wrap{max-width:900px;margin:0 auto}
          .va-kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.86em;color:#f4c430;margin:0 0 6px}
          .va-lead{color:#c4d2e8;font-size:1.05em;margin:0 0 22px;font-family:'Barlow',sans-serif}
          .va-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;justify-content:flex-start;-webkit-overflow-scrolling:touch}
          .va-item{flex:0 0 auto;width:250px;scroll-snap-align:center}
          .va-tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.78em;color:#f4c430;margin:0 0 8px}
          .va-card{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(244,196,48,.4);box-shadow:0 14px 40px rgba(0,0,0,.45);background:#000}
          .va-player{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#000}
          .va-sub{color:#c4d2e8;font-size:.92em;line-height:1.45;margin:10px 0 0;font-family:'Barlow',sans-serif}
          .va-hint{color:#8fa0b8;font-size:.82em;margin:2px 0 18px;font-family:'Barlow',sans-serif}
          .va-cta a{display:inline-block;padding:14px 34px;background:#f4c430;color:#1a1a2e;border-radius:50px;font-weight:700;font-family:'Barlow',sans-serif;font-size:1.05em;text-decoration:none}
          @media(min-width:900px){.va-rail{overflow:visible;justify-content:center}.va-hint{display:none}}
          </style>
          <div class="va-wrap">
          <p class="va-kick">M&iacute;ranos en 10 segundos</p>
          <p class="va-lead">Videos cortos, en espa&ntilde;ol, sobre lo que necesitas saber este a&ntilde;o.</p>
          <div class="va-rail">
          @@TARJETAS@@
          </div>
          <p class="va-hint">&#8592; desliza para ver los dem&aacute;s &#8594;</p>
          <div class="va-cta"><a href="#te-llamamos">D&eacute;janos tu n&uacute;mero</a></div>
          </div>
          </section>
          <!-- VIDEO-ASESORA-v1 fin -->

          '''.replace("@@TARJETAS@@", tarjetas)

          f="index.html"
          s=open(f,encoding="utf-8").read()
          antes=len(s)

          faltan=[]
          for t,n,d in VIDEOS:
              for req in (n+".mp4", "poster-"+n.replace("video-","")+".jpg"):
                  if not os.path.exists(req): faltan.append(req)
          if faltan:
              print("FALTAN estos archivos, sube primero los videos:", ", ".join(faltan)); sys.exit(1)

          A="<!-- VIDEO-ASESORA-v1 inicio -->"
          B="<!-- VIDEO-ASESORA-v1 fin -->"
          i=s.find(A)
          if i>=0:
              j=s.find(B,i)
              if j<0: print("bloque a medias. No se toca nada."); sys.exit(1)
              j+=len(B)
              while s[j:j+1]=="\n": j+=1
              s=s[:i]+s[j:]
          if A in s: print("quedo mas de un bloque. No se toca nada."); sys.exit(1)

          m=re.search(r'<section [^>]*>\s*<div[^>]*>\s*<h2[^>]*>[^<]*Gu[ií]as Gratis en Espa', s)
          if not m: print("no encuentro la seccion de las guias. No se toca nada."); sys.exit(1)
          out=s[:m.start()]+BLOQUE+s[m.start():]

          err=[]
          if "VIDEO-BIENVENIDA-v1" not in out: err.append("se perdio el video de bienvenida")
          if out.count("VIDEO-ASESORA-v1")!=2: err.append("el bloque no quedo completo")
          if out.count("<video")!=1+len(VIDEOS): err.append("no quedo el numero de videos esperado")
          if out.count("<video")!=out.count("</video>"): err.append("<video> desbalanceado")
          if out.count("<section")!=out.count("</section>"): err.append("<section> desbalanceado")
          if out.count("<div")!=out.count("</div>"): err.append("<div> desbalanceado")
          if 'id="te-llamamos"' not in out: err.append("no encuentro el formulario")
          if out.count("BLOQUE-TE-LLAMAMOS-v1")<3: err.append("se toco el bloque Te-Llamamos")
          if "emailjs" not in out: err.append("se perdio EmailJS")
          if out.count("enrollsalud.com/q/")<5: err.append("se perdieron botones del cotizador")
          if "video-bienvenida.mp4" not in out: err.append("se perdio el mp4 de bienvenida")
          for g in ("guia-aca-espanol.html","guia-medicare-espanol.html","guia-seguros-suplementarios-espanol.html"):
              if g not in out: err.append("se perdio el boton de "+g)
          mg=re.search(r'<h2[^>]*>[^<]*Gu[ií]as Gratis en Espa', out)
          if not mg or out.find("VIDEO-ASESORA-v1")>mg.start(): err.append("el bloque no quedo antes de las guias")
          for mm in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',out,re.S):
              try: json.loads(mm.group(1))
              except Exception as e: err.append("JSON-LD roto: %s"%e)
          if err:
              print("!!! PROBLEMAS, NO SE TOCA NADA:")
              for e in err: print("   -",e)
              sys.exit(1)

          if out==open(f,encoding="utf-8").read():
              print("ya estaba igual"); sys.exit(0)
          open(f,"w",encoding="utf-8").write(out)
          print("vitrina de %d videos puesta arriba de las guias (%d -> %d bytes)"%(len(VIDEOS),antes,len(out)))

          PYEOF
          python3 /tmp/vitrina.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/vitrina-tres-videos.yml
          git add -A
          git diff --cached --quiet && echo "nada que publicar" && exit 0
          git commit -m "Tercer video (suplementarios) en la vitrina de la portada"
          git push
