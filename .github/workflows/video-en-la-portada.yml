name: video-en-la-portada

on: push

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agregar el video nuevo en la portada (sin quitar el de bienvenida)
        run: |
          cat > /tmp/portada.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import sys,os,re,json

          NUEVO = '''
          <!-- VIDEO-ASESORA-v1 inicio -->
          <section class="va-sec">
          <style>
          .va-sec{background:#16213e;padding:44px 20px 40px;border-top:1px solid rgba(244,196,48,.25)}
          .va-wrap{max-width:860px;margin:0 auto;text-align:center}
          .va-kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.86em;color:#f4c430;margin:0 0 14px}
          .va-card{position:relative;width:100%;max-width:330px;margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid rgba(244,196,48,.4);box-shadow:0 16px 50px rgba(0,0,0,.45);background:#000}
          .va-player{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#000}
          .va-cap{max-width:560px;margin:18px auto 16px;color:#c4d2e8;font-size:1.02em;line-height:1.6}
          .va-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
          .va-cta .btn-hero,.va-cta .btn-ghost{display:inline-block;margin:0}
          </style>
          <div class="va-wrap">
          <p class="va-kick">Este a&ntilde;o el Mercado cambi&oacute; &mdash; m&iacute;ralo en 10 segundos</p>
          <div class="va-card">
          <video class="va-player" controls playsinline preload="none" poster="/poster-asesora.jpg">
          <source src="/video-asesora.mp4" type="video/mp4">
          Tu navegador no puede reproducir el video.
          </video>
          </div>
          <p class="va-cap">&iquest;Quieres que revisemos tu caso antes de renovar? En espa&ntilde;ol y sin costo.</p>
          <div class="va-cta">
          <a href="#te-llamamos" class="btn-hero">D&eacute;janos tu n&uacute;mero</a>
          <a href="tel:19543947439" class="btn-ghost">Llamar (954) 394-7439</a>
          </div>
          </div>
          </section>
          <!-- VIDEO-ASESORA-v1 fin -->

          '''

          f="index.html"
          s=open(f,encoding="utf-8").read()
          antes=len(s)

          if "VIDEO-ASESORA-v1" in s:
              print("ya estaba: la portada ya tiene el video nuevo"); sys.exit(0)

          for req in ("video-asesora.mp4","poster-asesora.jpg"):
              if not os.path.exists(req):
                  print("FALTA %s. No se toca nada."%req); sys.exit(1)

          ANCLA="<!-- BLOQUE-TE-LLAMAMOS-v1 inicio -->"
          k=s.find(ANCLA)
          if k<0:
              print("no encuentro el formulario Te-Llamamos en la portada. No se toca nada."); sys.exit(1)

          out=s[:k]+NUEVO.lstrip("\n")+s[k:]

          err=[]
          if "VIDEO-BIENVENIDA-v1" not in out: err.append("se perdio el video de bienvenida (ese se queda)")
          if out.count("VIDEO-ASESORA-v1")!=2: err.append("el bloque nuevo no quedo completo")
          if out.count("<video")!=2 or out.count("</video>")!=2: err.append("no quedaron exactamente 2 videos")
          if out.count("<section")!=out.count("</section>"): err.append("<section> desbalanceado")
          if 'id="te-llamamos"' not in out: err.append("no encuentro el ancla del formulario")
          if out.count("BLOQUE-TE-LLAMAMOS-v1")<3: err.append("se toco el bloque Te-Llamamos")
          if "emailjs" not in out: err.append("se perdio EmailJS")
          if out.count("enrollsalud.com/q/")<5: err.append("se perdieron botones del cotizador")
          if "video-bienvenida.mp4" not in out: err.append("se perdio el mp4 de bienvenida")
          if len(out)-antes < 1000 or len(out)-antes > 4000: err.append("el tamano cambio mas de lo esperado")
          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',out,re.S):
              try: json.loads(m.group(1))
              except Exception as e: err.append("JSON-LD roto: %s"%e)
          if err:
              print("!!! PROBLEMAS, NO SE TOCA NADA:")
              for e in err: print("   -",e)
              sys.exit(1)

          open(f,"w",encoding="utf-8").write(out)
          print("portada actualizada: %d -> %d bytes. El video de bienvenida SE QUEDA arriba; el nuevo entra abajo, antes del formulario."%(antes,len(out)))

          PYEOF
          python3 /tmp/portada.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/video-en-la-portada.yml
          git add -A
          git diff --cached --quiet && echo "nada que publicar" && exit 0
          git commit -m "Video de la asesora en la portada, antes del formulario"
          git push
