name: diseno-moderno
on:
  push:
    paths:
      - ".github/workflows/diseno-moderno.yml"
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas para recortar el logo
        run: python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
      - name: Aplicar el diseno moderno a la portada
        run: |
          cat > /tmp/aplicar.py <<'PYEOF'
          import re, json, base64, io, sys
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np

          MARK = "DISENO-MODERNO-v1"
          h = open("index.html", encoding="utf-8").read()
          if MARK in h:
              print("ya estaba aplicado, no se toca nada"); sys.exit(0)
          orig = h

          # 1) Imagenes del logo, sacadas del logo que ya trae la barra de arriba
          m = re.search(r'<nav id="navbar">\s*<div class="nav-brand"[^>]*><img src="data:image/\w+;base64,([^"]+)"', h)
          assert m, "no encontre el logo de la barra"
          im = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGB")
          assert im.size == (1086, 780), im.size
          cx, cy, r = 288, 372, 222
          S = 2 * r
          em = im.crop((cx - r, cy - r, cx + r, cy + r)).convert("RGBA")
          mask = Image.new("L", (S * 4, S * 4), 0); ImageDraw.Draw(mask).ellipse((0, 0, S * 4 - 1, S * 4 - 1), fill=255)
          mask = mask.resize((S, S), Image.LANCZOS).filter(ImageFilter.GaussianBlur(3))
          a = np.asarray(em).astype(float); mk = np.asarray(mask).astype(float)
          al = np.minimum(mk, np.clip((a[..., :3].max(axis=2) - 55) * 2.2, 0, 255))
          yy, xx = np.mgrid[0:S, 0:S]; al = np.where(np.hypot(xx - r, yy - r) < 185, mk, al)
          a[..., 3] = al
          Image.fromarray(a.astype("uint8")).resize((360, 360), Image.LANCZOS).save("gm-emblema.webp", quality=86)
          w = np.asarray(im.crop((505, 215, 1040, 520)).convert("RGBA")).astype(float)
          w[..., 3] = np.clip((w[..., :3].max(axis=2) - 95) * 2.6, 0, 255)
          Image.fromarray(w.astype("uint8")).resize((480, int(305 * 480 / 535)), Image.LANCZOS).save("gm-letras.webp", quality=88)

          # 2) Logo en 3D dentro del hero
          STAGE = '''<!-- DISENO-MODERNO-v1 logo -->
            <div class="gm-stage" id="gm-stage" aria-hidden="true">
              <div class="gm-logo" id="gm-logo">
                <div class="gm-badge"><span class="gm-orb gm-o1"></span><span class="gm-halo"></span><img src="/gm-emblema.webp" alt="" width="360" height="360"><span class="gm-ring"></span></div>
                <div class="gm-word"><img src="/gm-letras.webp" alt="" width="480" height="273"><span class="gm-sheen"></span></div>
              </div>
              <div class="gm-shadow"></div>
            </div>
          '''
          i = h.find('<section class="hero">'); assert i > 0
          j = h.find('</section>', i); assert j > i
          h = h[:j] + STAGE + h[j:]

          # 3) Resenas que pasan solas (en lugar del widget viejo de Famewall)
          OLD_FW = '<div style="margin:0 auto 40px;max-width:1200px;"><div class="famewall-embed" data-src="greatinsuranceteam" data-format="grid" style="width:100%;display:block!important;"></div><script type="text/javascript" src="https://embed.famewall.io/newFrame.js" defer></script></div>'
          assert h.count(OLD_FW) == 1, "no encontre el widget de resenas"
          R = [
           ("Perla Tiberio", "Se toma el tiempo de escuchar, explicar y buscar soluciones, sin hacerte sentir que eres un cliente más.", "#7a4fc2"),
           ("Norvely Morales", "Liliana es muy amable, paciente y organizada, por lo que no he tenido problemas con mi póliza.", "#b8442b"),
           ("Martha Pineda", "Nos ayudan con el proceso de renovación cada año. Las recomiendo.", "#2f8a63"),
           ("Elsa Diaz", "Liliana Vera ha sido mi agente desde 2023 y siempre me ha ayudado e informado. Muy recomendado.", "#3b6fd6"),
           ("Emiliano Provenzali", "Súper profesionales. Saben explicar al detalle cada plan de salud.", "#c48a0e"),
           ("Diana Villanueva", "Tengo muchos años con ellos asesorándome en todo lo de taxes y seguro médico.", "#b8326f"),
           ("Kathe Ramirez", "Excelente servicio, son proactivos, muy serviciales y muy amables.", "#2b8fb8"),
           ("Adriana Franco", "Liliana es increíblemente atenta, resolvió cada una de mis dudas con paciencia.", "#5a7d1a"),
           ("Guiomar Centeno", "Eficiencia, calidad y confianza.", "#8a4b2b"),
           ("KimoOfficial", "Muy buen servicio al cliente, eficientes y rápidos en atender.", "#2f5f9e"),
          ]
          def card(n, t, c, hidden):
              ini = "".join(p[0] for p in n.split())[:2].upper()
              return ('<div class="gm-rc"%s><div class="gm-who"><span class="gm-av" style="background:%s">%s</span><div><strong>%s</strong><span class="gm-g">Reseña de Google</span></div></div><div class="gm-st">★★★★★</div><p>%s</p></div>'
                      % (' aria-hidden="true"' if hidden else '', c, ini, n, t))
          cards = "".join(card(*x, False) for x in R) + "".join(card(*x, True) for x in R)
          NEW_FW = '<!-- DISENO-MODERNO-v1 resenas --><div class="gm-marquee" aria-label="Reseñas de clientes en Google"><div class="gm-track">' + cards + '</div></div>'
          h = h.replace(OLD_FW, NEW_FW)
          assert h.count("Más de 50 reseñas en Google") == 1
          h = h.replace("Más de 50 reseñas en Google", "Más de 75 reseñas en Google")

          # 4) Estilos y movimiento (al final de la pagina)
          BLOCK = r'''<!-- DISENO-MODERNO-v1 inicio -->
          <canvas id="gm-stars" aria-hidden="true"></canvas>
          <style>
          @property --gma{syntax:"<angle>";inherits:false;initial-value:0deg}
          @keyframes gm-rot{to{--gma:360deg}}
          @keyframes gm-float{0%,100%{transform:translateY(0) rotateX(4deg) rotateY(-8deg)}50%{transform:translateY(-14px) rotateX(-3deg) rotateY(8deg)}}
          @keyframes gm-shadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.82);opacity:.55}}
          @keyframes gm-neon{0%{opacity:0}8%{opacity:1}12%{opacity:.1}20%{opacity:.9}26%{opacity:.2}34%,100%{opacity:1}}
          @keyframes gm-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(1.05)}}
          @keyframes gm-sheen{0%,55%{background-position:120% 0}100%{background-position:-20% 0}}
          @keyframes gm-shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
          @keyframes gm-gold{0%,100%{background-position:100% 0}50%{background-position:0 0}}
          @keyframes gm-marq{to{transform:translateX(-50%)}}
          @keyframes gm-spin2{to{transform:rotate(360deg)}}
          #gm-stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
          .gm-stage{position:absolute;top:50%;right:max(240px,calc(290px - 6vw));transform:translate(50%,-50%);z-index:2;display:grid;justify-items:center;perspective:1100px;width:360px}
          .gm-logo{position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);display:grid;justify-items:center;gap:4px}
          .gm-badge{position:relative;width:280px;aspect-ratio:1;max-width:100%;transform:translateZ(60px)}
          .gm-badge img{width:100%;height:100%;display:block;position:relative;z-index:2;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
          .gm-ring{position:absolute;inset:3.5%;border-radius:50%;z-index:3;pointer-events:none;background:conic-gradient(from var(--gma),transparent 0 62%,rgba(169,210,255,.95) 74%,#fff 76%,rgba(232,168,40,.9) 79%,transparent 88%);-webkit-mask:radial-gradient(circle,transparent 86.5%,#000 88.5% 93%,transparent 95%);mask:radial-gradient(circle,transparent 86.5%,#000 88.5% 93%,transparent 95%);animation:gm-rot 6s linear infinite;mix-blend-mode:screen}
          .gm-halo{position:absolute;inset:-8%;border-radius:50%;z-index:1;background:radial-gradient(circle,rgba(90,168,255,.42) 0%,rgba(90,168,255,.12) 45%,transparent 68%);animation:gm-neon 2.2s steps(1,end) .3s both,gm-breathe 4.5s ease-in-out 2.6s infinite}
          .gm-orb{position:absolute;inset:-12%;border-radius:50%;border:1px solid rgba(169,210,255,.12);z-index:0;animation:gm-spin2 14s linear infinite}
          .gm-orb::before{content:"";position:absolute;top:50%;left:-4px;width:8px;height:8px;border-radius:50%;background:#f7c858;box-shadow:0 0 12px 3px rgba(247,200,88,.7)}
          .gm-word{position:relative;width:320px;max-width:100%;transform:translateZ(30px)}
          .gm-word img{width:100%;height:auto;display:block}
          .gm-sheen{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:300% 100%;background-position:120% 0;-webkit-mask:url(/gm-letras.webp) center/100% 100% no-repeat;mask:url(/gm-letras.webp) center/100% 100% no-repeat;mix-blend-mode:overlay;animation:gm-sheen 5.5s ease-in-out 1.2s infinite}
          .gm-shadow{width:58%;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);margin-top:6px;animation:gm-shadow 7s ease-in-out infinite}
          .gm-floaty{animation:gm-float 7s ease-in-out infinite}
          @media (max-width:1180px){.hero{flex-direction:column;justify-content:center}.hero-orbits{display:none}.gm-stage{position:relative;top:auto;right:auto;transform:none;width:auto;margin:0 auto 18px;order:-1}.gm-badge{width:min(200px,46vw)}.gm-word{width:min(260px,62vw)}.hero-content{width:100%}}
          .hero-title .accent{background:linear-gradient(100deg,#c4870e 0%,#f7c858 30%,#fff3cf 45%,#e8a828 60%,#c4870e 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gm-gold 6s ease-in-out infinite}
          .btn-hero{position:relative;overflow:hidden}
          .btn-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 48%,transparent 66%);transform:translateX(-120%);animation:gm-shine 4.5s ease-in-out 2s infinite;pointer-events:none}
          .svc{transition:background .3s,transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
          .svc.gm-on{z-index:3;box-shadow:0 30px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(90,168,255,.25)}
          .gm-glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(169,210,255,.14),transparent 45%);opacity:0;transition:opacity .35s}
          .svc.gm-on .gm-glare{opacity:1}
          .vidb-card::after,.va-card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:2;background:conic-gradient(from var(--gma),transparent 0 60%,#a9d2ff 72%,#f7c858 80%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:gm-rot 7s linear infinite}
          .gm-marquee{margin:0 auto 40px;max-width:1200px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);text-align:left}
          .gm-track{display:flex;gap:20px;width:max-content;animation:gm-marq 70s linear infinite}
          .gm-marquee:hover .gm-track{animation-play-state:paused}
          .gm-rc{width:min(320px,76vw);flex:none;background:linear-gradient(170deg,#fff,#eef3fb);color:#1a2540;border-radius:14px;padding:18px 20px;box-shadow:0 20px 40px -24px rgba(0,0,0,.8);font-family:'Barlow',sans-serif}
          .gm-who{display:flex;align-items:center;gap:12px;margin-bottom:8px}
          .gm-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#fff;font-size:15px;flex:none}
          .gm-rc strong{display:block;font-size:15px;line-height:1.2}
          .gm-g{font-size:12px;color:#5b6b8c}
          .gm-st{color:#e2a516;letter-spacing:2px;font-size:14px}
          .gm-rc p{margin:6px 0 0;font-size:15px;line-height:1.5;color:#1a2540}
          .gm-rv{opacity:.35;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
          .gm-rv.gm-in{opacity:1;transform:none}
          @media (prefers-reduced-motion:reduce){.gm-ring,.gm-halo,.gm-orb,.gm-sheen,.gm-shadow,.gm-floaty,.hero-title .accent,.btn-hero::after,.vidb-card::after,.va-card::after,.gm-track{animation:none!important}.gm-rv{opacity:1;transform:none}.gm-marquee{overflow-x:auto}}
          </style>
          <script>
          (function(){try{
          var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
          var stage=document.getElementById('gm-stage'), logo=document.getElementById('gm-logo');
          if(stage&&logo&&!reduce){
            if(fine){var hero=stage.closest('.hero')||stage;
              hero.addEventListener('pointermove',function(e){var b=stage.getBoundingClientRect(),x=(e.clientX-(b.left+b.width/2))/b.width,y=(e.clientY-(b.top+b.height/2))/b.height;x=Math.max(-1,Math.min(1,x));y=Math.max(-1,Math.min(1,y));logo.style.transform='rotateY('+(x*24)+'deg) rotateX('+(-y*18)+'deg)';});
              hero.addEventListener('pointerleave',function(){logo.style.transform='';});
            } else logo.classList.add('gm-floaty');
          }
          if(fine&&!reduce){document.querySelectorAll('.svc').forEach(function(c){var g=document.createElement('span');g.className='gm-glare';c.appendChild(g);
            c.addEventListener('pointermove',function(e){var b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.classList.add('gm-on');c.style.transform='perspective(1000px) rotateY('+((x-.5)*10)+'deg) rotateX('+((.5-y)*8)+'deg) translateZ(4px)';});
            c.addEventListener('pointerleave',function(){c.classList.remove('gm-on');c.style.transform='';});});}
          if('IntersectionObserver' in window&&!reduce){var vh=innerHeight;
            var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('gm-in');io.unobserve(e.target);}})},{threshold:.12});
            document.querySelectorAll('.svc,.ti,.va-item,.vidb-card').forEach(function(el){if(el.getBoundingClientRect().top>vh*.95){el.classList.add('gm-rv');io.observe(el);}});
            var nums=[].slice.call(document.querySelectorAll('.ti-num')),done=false,tb=document.querySelector('.trust-bar');
            if(tb){new IntersectionObserver(function(es){if(!es[0].isIntersecting||done)return;done=true;nums.forEach(function(n){var t=n.childNodes[0];if(!t||t.nodeType!==3)return;var m=t.nodeValue.match(/^(\$?)(\d+)(%?)$/);if(!m||m[2]==='0')return;var end=+m[2],t0=null;function st(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1600);t.nodeValue=m[1]+Math.round(end*(1-Math.pow(1-p,3)))+m[3];if(p<1)requestAnimationFrame(st);}requestAnimationFrame(st);});},{threshold:.4}).observe(tb);}
          }
          var cv=document.getElementById('gm-stars');if(!cv)return;var cx=cv.getContext('2d'),W,H,S=[],mx=0,my=0,dpr=Math.min(2,devicePixelRatio||1),raf=0;
          function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;var n=Math.round(Math.min(130,innerWidth/10));S=[];for(var i=0;i<n;i++)S.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,r:(Math.random()*1.3+.3)*dpr,p:Math.random()*6.28,c:Math.random()<.12?'247,200,88':(Math.random()<.5?'169,210,255':'255,255,255')});}
          size();addEventListener('resize',size);
          if(fine)addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
          function draw(ts){cx.clearRect(0,0,W,H);var sy=scrollY*dpr;for(var i=0;i<S.length;i++){var s=S[i],x=((s.x+mx*40*s.z*dpr)%W+W)%W,y=((s.y-sy*.15*s.z+my*30*s.z*dpr)%H+H)%H,a=reduce?.6:(.35+.45*Math.sin(ts/900*s.z+s.p));cx.beginPath();cx.arc(x,y,s.r*s.z+.2,0,6.283);cx.fillStyle='rgba('+s.c+','+a.toFixed(2)+')';cx.fill();if(!reduce){s.x+=.05*s.z*dpr;if(s.x>W)s.x=0;}}if(!reduce)raf=requestAnimationFrame(draw);}
          raf=requestAnimationFrame(draw);
          document.addEventListener('visibilitychange',function(){cancelAnimationFrame(raf);if(!document.hidden&&!reduce)raf=requestAnimationFrame(draw);});
          }catch(e){}})();
          </script>
          <!-- DISENO-MODERNO-v1 fin -->
          '''
          k = h.rfind("</body>"); assert k > 0
          h = h[:k] + BLOCK + h[k:]

          # 5) Revision antes de guardar: si algo falla, no se publica nada
          for blk in re.findall(r'<script type="application/ld\+json">([\s\S]*?)</script>', h):
              json.loads(blk)
          for key in ["VIDEO-BIENVENIDA-v1", "VIDEO-ASESORA-v1", "BLOQUE-TE-LLAMAMOS-v1", "emailjs", "service_jjg4int", "template_tndcul8", "SISTER-COMPANIES-v1", 'id="contacto"', "enrollsalud.com/q/", "g.page/r/CfgoLGTznyLPEBM/review"]:
              assert h.count(key) == orig.count(key), "cambio inesperado en " + key
          assert m.group(1) in h, "el logo de la barra cambio"
          assert h.count(MARK) == 4
          assert "famewall" not in h
          open("index.html", "w", encoding="utf-8").write(h)
          print("OK", len(orig), "->", len(h))

          PYEOF
          echo "114407e60d809126ad65a2e22402a07e5daf75daf7a432c460aa8eec2848bc76  /tmp/aplicar.py" | sha256sum -c -
          python3 /tmp/aplicar.py
      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/diseno-moderno.yml
          rm -f .github/workflows/diseno-moderno.yml
          git add index.html gm-emblema.webp gm-letras.webp
          git commit -m "Portada: diseno moderno (logo 3D, estrellas, resenas en movimiento)"
          git push
