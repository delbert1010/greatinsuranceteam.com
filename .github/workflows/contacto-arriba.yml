name: contacto-arriba
on:
  push:
    paths:
      - '.github/workflows/contacto-arriba.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios de la portada
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/patch.py <<'PYEOF'
          import sys, re, urllib.parse
          p = sys.argv[1]
          h = open(p, encoding='utf-8').read()

          def rep(old, new, count=1):
              global h
              n = h.count(old)
              assert n == count, (n, count, old[:90])
              h = h.replace(old, new)

          WA_MSG = urllib.parse.quote("Hola, vi su página web y quiero información sobre un seguro.")
          WA = "https://wa.me/19543947439?text=" + WA_MSG

          # 0. marcador de idempotencia
          assert 'CONTACTO-ARRIBA-v1' not in h, 'ya aplicado'

          # 1. WhatsApp con mensaje listo (los 6 enlaces de la portada)
          rep('https://wa.me/19543947439"', WA + '"', 6)

          # 2. Boton de arriba "Cotizacion Gratis" -> formulario corto
          rep('<a href="#contacto" class="nav-cta">Cotización Gratis</a>',
              '<a href="#te-llamamos" class="nav-cta">Cotización Gratis</a>')

          # 3. Hero: prueba social + llamar/WhatsApp arriba
          old_actions = ('    <div class="hero-actions">\n'
           '      <a href="#contacto" class="btn-hero">Encontrar mi seguro →</a>\n'
           '      <a href="' + WA + '" class="btn-ghost" target="_blank" rel="noopener noreferrer">Hablar por WhatsApp</a>\n'
           '    </div>\n'
           '    <a class="trust-link" href="#resenas">Lee las reseñas de nuestros clientes →</a>\n')
          new_actions = ('    <!-- CONTACTO-ARRIBA-v1 -->\n'
           '    <ul class="hp-proof" aria-label="Por qué confiar en nosotros">\n'
           '      <li><a href="#resenas"><b class="hp-star">★★★★★ 5.0</b> · <span class="hp-n">79</span> reseñas en Google</a></li>\n'
           '      <li><b>+500</b> familias atendidas</li>\n'
           '      <li><b>100%</b> en español</li>\n'
           '      <li>Seguros <b>y taxes</b> en un solo lugar</li>\n'
           '    </ul>\n'
           '    <div class="hero-actions">\n'
           '      <a href="tel:+19543947439" class="btn-hero">Llamar ahora</a>\n'
           '      <a href="' + WA + '" class="btn-ghost" target="_blank" rel="noopener noreferrer">Escribir por WhatsApp</a>\n'
           '    </div>\n'
           '    <a class="trust-link" href="#te-llamamos">Prefiero que me llamen →</a>\n')
          rep(old_actions, new_actions)

          # mover prueba+botones antes del parrafo largo (para que salgan en la primera pantalla)
          hook_start = h.index('    <p class="hero-hook">')
          hook_end = h.index('</p>\n', hook_start) + len('</p>\n')
          hook = h[hook_start:hook_end]
          blk_start = h.index('    <!-- CONTACTO-ARRIBA-v1 -->')
          blk_end = h.index('Prefiero que me llamen →</a>\n') + len('Prefiero que me llamen →</a>\n')
          assert hook_end == blk_start, 'el bloque no sigue al parrafo'
          blk = h[blk_start:blk_end]
          h = h[:hook_start] + blk + hook + h[blk_end:]

          # 4. Estilos del bloque nuevo + logo mas pequeno en celular (va al final del <head>)
          css = ('<style id="contacto-arriba-v1">\n'
           '.hp-proof{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 1.6rem;padding:0}\n'
           '.hp-proof li{font-family:\'Barlow\',sans-serif;font-size:.92rem;color:var(--silver2);background:rgba(255,255,255,.06);border:1px solid rgba(232,168,40,.35);border-radius:999px;padding:6px 14px;line-height:1.3}\n'
           '.hp-proof b{color:var(--gold3);font-weight:700}\n'
           '.hp-proof a{color:inherit;text-decoration:none}\n'
           '.hp-proof .hp-star{letter-spacing:.02em}\n'
           '.hero-actions+.trust-link{display:block}\n'
           '.hero-actions+.trust-link+.hero-hook{margin-top:1.8rem}\n'
           '@media(max-width:600px){\n'
           '  .hero{min-height:auto;padding-top:92px;padding-bottom:40px}\n'
           '  .hero .gm-stage{margin:0 auto 4px}\n'
           '  .hero .gm-stage .gm-badge{width:92px}\n'
           '  .hero .gm-stage .gm-word{width:150px}\n'
           '  .hero .gm-stage .gm-shadow{display:none}\n'
           '  .hero-pill{margin-bottom:1rem}\n'
           '  .hero-title{margin-bottom:1rem}\n'
           '  .hp-proof{gap:6px;margin-bottom:1.2rem}\n'
           '  .hp-proof li{font-size:.84rem;padding:5px 11px}\n'
           '  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n'
           '  .hero-actions>*{padding-left:8px!important;padding-right:8px!important}\n'
           '  .hero-hook{margin-top:1.6rem;margin-bottom:0}\n'
           '}\n'
           '.oep-tpmo{max-width:900px;margin:1.2rem auto 0;color:var(--silver);font-size:.8rem;line-height:1.55;text-align:center;opacity:.9}\n'
           '</style>\n</head>')
          rep('</head>', css)

          # 5. Mover "Te Llamamos" y reseñas justo debajo del hero
          a = h.index('<!-- BLOQUE-TE-LLAMAMOS-v1 inicio -->')
          b = h.index('<!-- BLOQUE-TE-LLAMAMOS-v1 fin -->') + len('<!-- BLOQUE-TE-LLAMAMOS-v1 fin -->')
          tll = h[a:b]
          h = h[:a] + h[b:]
          a = h.index('<!-- TESTIMONIALS --><section id="resenas"')
          b = h.index('</section>', a) + len('</section>')
          res = h[a:b]
          assert 'Deja Tu Opinión en Google' in res
          h = h[:a] + h[b:]
          anchor = '<!-- VIDEO-BIENVENIDA-v1 inicio -->'
          assert h.count(anchor) == 1
          h = h.replace(anchor, tll + '\n\n' + res + '\n\n' + anchor)

          # 6. Te Llamamos: no marcar todo como ACA; la fecha de noviembre ya pasó
          rep("var COB='Seguro de Salud (ACA)',", "var COB='Sin especificar (preguntar en la llamada)',")
          rep("var form=document.getElementById('tll-form');if(!form)return;",
              "var form=document.getElementById('tll-form');if(!form)return;\n"
              "document.addEventListener('click',function(ev){var t=ev.target&&ev.target.closest?ev.target.closest('[data-cob]'):null;if(t)COB=t.getAttribute('data-cob');});")
          rep('<a href="#te-llamamos" class="btn-hero">Revisar mi plan de Medicare &rarr;</a>',
              '<a href="#te-llamamos" class="btn-hero" data-cob="Medicare Advantage">Revisar mi plan de Medicare &rarr;</a>')
          rep('<a href="#te-llamamos" class="btn-hero">Explorar mis opciones de ACA &rarr;</a>',
              '<a href="#te-llamamos" class="btn-hero" data-cob="Seguro de Salud (ACA)">Explorar mis opciones de ACA &rarr;</a>')
          rep('La inscripci&oacute;n para 2027 abre el <strong>1 de noviembre</strong> y este a&ntilde;o piden m&aacute;s requisitos y papeles.',
              'La inscripci&oacute;n para 2027 <strong>ya est&aacute; abierta</strong> y este a&ntilde;o piden m&aacute;s requisitos y papeles.')

          # 7. Banner rojo: sin "cupos" inventados y con la fecha al día
          rep('El Open Enrollment de ACA comienza el 1º de noviembre. <span>Agenda tu cita antes de que se llenen los cupos →</span>',
              'El Open Enrollment de ACA ya está abierto. <span>Ver fechas y pedir cita gratis →</span>')
          rep('<div class="oep-card">\n      <span class="oep-badge">Comienza el 1&ordm; de noviembre</span>',
              '<div class="oep-card is-open">\n      <span class="oep-badge">Ya est&aacute; abierto</span>')

          # 8. Aviso obligatorio de Medicare (TPMO) en la sección de fechas y al pie
          TPMO = ('No estamos afiliados ni respaldados por el gobierno federal ni por el programa Medicare. '
                  'No ofrecemos todos los planes disponibles en su área; cualquier información que le demos se limita a los planes que ofrecemos en su área. '
                  'Comuníquese con Medicare.gov, 1-800-MEDICARE (1-800-633-4227) o con SHINE, el programa SHIP de Florida, para información sobre todas sus opciones.')
          rep('</div>\n</section>\n<!-- /OPEN ENROLLMENT -->', '<p class="oep-tpmo">Medicare: ' + TPMO + '</p>\n</div>\n</section>\n<!-- /OPEN ENROLLMENT -->')
          rep('      Las coberturas, precios y disponibilidad varían por estado y perfil del solicitante.\n',
              '      Las coberturas, precios y disponibilidad varían por estado y perfil del solicitante.<br>\n      Medicare: ' + TPMO + '\n')

          # 9. Formulario principal: solo los 8 estados con licencia
          a = h.index('id="f-state"'); a = h.index('>', a) + 1
          b = h.index('</select>', a)
          old_opts = h[a:b]
          assert old_opts.count('<option') == 52, old_opts.count('<option')
          new_opts = ('\n                <option value="">Selecciona tu estado</option>\n'
           + ''.join('                <option value="%s">%s</option>\n' % kv for kv in [
             ('FL','Florida'),('TX','Texas'),('GA','Georgia'),('TN','Tennessee'),('AZ','Arizona'),
             ('OK','Oklahoma'),('NC','Carolina del Norte'),('SC','Carolina del Sur'),('Otro','Otro estado')])
           + '              ')
          h = h[:a] + new_opts + h[b:]

          # 10. El número de reseñas de la franja copia el de la sección de reseñas (se actualiza solo)
          rep('</body>', "<script>(function(){try{var s=document.getElementById('gm-resenas-total'),d=document.querySelectorAll('.hp-n');if(s&&s.textContent.trim())d.forEach(function(e){e.textContent=s.textContent.trim();});}catch(e){}})();</script>\n</body>")

          open(p, 'w', encoding='utf-8').write(h)
          print('OK')
          PYEOF
          echo "f7ceb4508ba4e92d14c90bf924937d0bd8ef620027ced499b6789c66e92114f6  /tmp/patch.py" | sha256sum -c -
          if ! echo "8f1d0222678b18b1b3e2d89486982c06ca482730e8e4bef96a7abefbd9605f03  index.html" | sha256sum -c -; then
            echo "index.html cambio desde que se probo: no se toca nada"
            git rm -f .github/workflows/contacto-arriba.yml
            git commit -m "contacto-arriba: cancelado, index.html distinto al probado"
            git push
            exit 1
          fi
          python3 /tmp/patch.py index.html
          echo "d51c2ff4569985176ac7e0df3a98aa910eb59d384ff2b9980e8565d25afb918c  index.html" | sha256sum -c -
          git rm -f .github/workflows/contacto-arriba.yml
          git add index.html
          git commit -m "Portada: resenas y contacto arriba, WhatsApp con mensaje, Te Llamamos sin ACA fijo, aviso TPMO, 8 estados"
          git push
