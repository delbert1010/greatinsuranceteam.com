name: Arreglar guias ACA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arreglar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mover guias a la raiz y borrar la carpeta subida por error
        run: |
          set -e
          if [ ! -d "SUBIR-A-GITHUB" ]; then
            echo "No hay nada que arreglar."
            exit 0
          fi
          for f in guia-aca-texas guia-aca-georgia guia-aca-tennessee \
                   guia-aca-arizona guia-aca-oklahoma \
                   guia-aca-carolina-del-norte guia-aca-carolina-del-sur; do
            cp "SUBIR-A-GITHUB/$f.html" "$f.html"
            echo "movido: $f.html"
          done
          rm -rf SUBIR-A-GITHUB
          rm -f .github/workflows/arreglar-guias.yml
          echo "--- verificacion ---"
          for f in guia-aca-*.html; do
            echo "$f: $(grep -c 'enrollsalud.com/q/liliana-vera' "$f") enlaces"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Mover guias ACA por estado a la raiz y quitar carpeta subida por error"
          git push
