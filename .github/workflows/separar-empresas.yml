name: separar-empresas
on:
  push:
    paths:
      - '.github/workflows/separar-empresas.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separar Great de Consulting en la web
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/patch.py <<'PYEOF'
          import re,sys,io
          R='SEPARAR-EMPRESAS-v1'
          def rd(f): return open(f,encoding='utf-8').read()
          def wr(f,t): open(f,'w',encoding='utf-8').write(t)
          def sub1(t,old,new,f):
              assert t.count(old)==1,(f,t.count(old),old[:70]); return t.replace(old,new)
          ADDR='8891 Brighton Lane, Oficina 108, Bonita Springs, FL 34135'
          LEGAL='Great Insurance Team &amp; Tax Service LLC'
          idx=rd('index.html'); assert R not in idx
          # 1) quitar seccion "companias hermanas"
          a=idx.index('<!-- SISTER-COMPANIES-v1 inicio -->'); b=idx.index('<!-- SISTER-COMPANIES-v1 fin -->')+len('<!-- SISTER-COMPANIES-v1 fin -->')
          idx=idx[:a]+'<!-- '+R+' -->'+idx[b:]
          assert 'Consulting' not in idx.replace('Consulting Enterprise','X') or True
          # 2) JSON-LD
          idx=sub1(idx,'''      "name": "Great Insurance Team",
                "alternateName"''','''      "name": "Great Insurance Team",
                "legalName": "Great Insurance Team & Tax Service LLC",
                "address": {
                  "@type": "PostalAddress",
                  "streetAddress": "8891 Brighton Lane, Office 108",
                  "addressLocality": "Bonita Springs",
                  "addressRegion": "FL",
                  "postalCode": "34135",
                  "addressCountry": "US"
                },
                "identifier": {
                  "@type": "PropertyValue",
                  "name": "Florida DFS Insurance Agency License",
                  "value": "L110690"
                },
                "alternateName"''','index')
          # 3) pie
          idx=sub1(idx,'© 2026 Great Insurance Team. Todos los derechos reservados.<br>','© 2026 '+LEGAL+'. Todos los derechos reservados.<br>\n      Agencia de seguros licenciada en Florida (licencia L110690). Domicilio registrado: '+ADDR+'. Atención por teléfono en español.<br>','index-pie')
          wr('index.html',idx)
          # 4) aviso legal
          t=rd('aviso-legal.html'); assert R not in t
          m=re.search(r'<p>Este sitio web \(greatinsuranceteam\.com\) es operado por <strong>Consulting Enterprise MRM LLC</strong>.*?</p>',t,re.S); assert m
          t=t.replace(m.group(0),'<p>Este sitio web (greatinsuranceteam.com) es operado por <strong>'+LEGAL+'</strong>, agencia de seguros y preparación de impuestos registrada en el estado de Florida, EE.UU., con licencia de agencia de seguros del Departamento de Servicios Financieros de Florida n.º <strong>L110690</strong>. Domicilio registrado: '+ADDR+'. Es una dirección registrada: la atención es por teléfono y WhatsApp; no se atiende al público en ese domicilio. Ofrecemos asesoría de seguros y preparación de impuestos en español.</p>')
          t=sub1(t,'es propiedad de Consulting Enterprise MRM LLC y no puede','es propiedad de '+LEGAL+' y no puede','aviso6')
          t=sub1(t,'    <li><strong>Sitio web:</strong> greatinsuranceteam.com</li>','    <li><strong>Domicilio registrado:</strong> '+ADDR+'</li>\n    <li><strong>Sitio web:</strong> greatinsuranceteam.com</li>','aviso10')
          t=sub1(t,'<!-- ','<!-- '+R+' --><!-- ','aviso-marca') if t.count('<!-- ')==1 else t.replace('</body>','<!-- '+R+' -->\n</body>',1)
          t=sub1(t,'Última actualización: 16 de julio de 2026','Última actualización: 19 de noviembre de 2026','avfecha')
          wr('aviso-legal.html',t)
          # 5) privacidad
          t=rd('politica-de-privacidad.html'); assert R not in t
          m=re.search(r'Este sitio web \(greatinsuranceteam\.com\) es operado por <strong>Consulting Enterprise MRM LLC</strong>, que opera comercialmente como <strong>Great Insurance Team &amp; Tax Service</strong> \(&quot;nosotros&quot;, &quot;nuestro&quot;\)|Este sitio web \(greatinsuranceteam\.com\) es operado por <strong>Consulting Enterprise MRM LLC</strong>, que opera comercialmente como <strong>Great Insurance Team &amp; Tax Service</strong> \("nosotros", "nuestro"\)',t); assert m,'priv1'
          t=t.replace(m.group(0),'Este sitio web (greatinsuranceteam.com) es operado por <strong>'+LEGAL+'</strong> ("nosotros", "nuestro"), agencia de seguros con licencia de Florida n.º L110690. Los datos que usted nos da en los formularios de seguros e impuestos de este sitio los recibe esta empresa')
          t=sub1(t,'    <li><strong>Sitio web:</strong> greatinsuranceteam.com</li>','    <li><strong>Domicilio registrado:</strong> '+ADDR+'</li>\n    <li><strong>Sitio web:</strong> greatinsuranceteam.com</li>','priv14')
          t=t.replace('</body>','<!-- '+R+' -->\n</body>',1)
          t=sub1(t,'Última actualización: 12 de agosto de 2026','Última actualización: 19 de noviembre de 2026','prfecha')
          wr('politica-de-privacidad.html',t)
          # 6) llms.txt
          t=rd('llms.txt'); assert R not in t
          t=sub1(t,'- Modalidad: atención por teléfono en español.','- Empresa: Great Insurance Team & Tax Service LLC, agencia de seguros licenciada en Florida (licencia L110690). Domicilio registrado: 8891 Brighton Lane, Oficina 108, Bonita Springs, FL 34135.\n- Modalidad: atención por teléfono en español.','llms')
          wr('llms.txt',t+'\n<!-- '+R+' -->\n' if False else t)
          print('OK')
          PYEOF
          echo "97b2442fb47a74fc56586d2f6683911cbf8619edc5b5dc39f2079df8435b9c8c  /tmp/patch.py" | sha256sum -c -
          if ! cat <<'SUMS' | sha256sum -c -
          d51c2ff4569985176ac7e0df3a98aa910eb59d384ff2b9980e8565d25afb918c  index.html
          70601865c205e95669e4a4cedc064e9e3ff292eb233597e957f8b8c3dfedebb2  aviso-legal.html
          aa9c1a8aa92da330bddd5ad61337b35f036bd25fcce67e067247e7470f5ec4d6  politica-de-privacidad.html
          d2a12201d7d3fa31a765233239d6929f615a8ab6ad5286cde71716a477a70d64  llms.txt
          SUMS
          then
            echo "Los archivos cambiaron desde que se probo: no se toca nada"
            git rm -f .github/workflows/separar-empresas.yml
            git commit -m "separar-empresas: cancelado, archivos distintos a los probados"
            git push
            exit 1
          fi
          python3 /tmp/patch.py
          cat <<'SUMS' | sha256sum -c -
          e795495e2fcaeec673590beb775755b8532299e7ca90ed7190761c85af0d1be1  index.html
          ec027d206244f7cf084227ff03d9691b8c6c043a2fa1567df734c10c65199a49  aviso-legal.html
          e6ad6171a0dbeb5116cf174053a28156e41dd9a74cc0957260e78caae7973775  politica-de-privacidad.html
          6e357e22f415c2541aad0e2ef709bd43d6cb7c1d540796495f3f6f9108e41530  llms.txt
          SUMS
          git rm -f .github/workflows/separar-empresas.yml
          git add index.html aviso-legal.html politica-de-privacidad.html llms.txt
          git commit -m "Separar Great (agencia licenciada) de Consulting: aviso legal, privacidad, portada, datos de Google"
          git push
