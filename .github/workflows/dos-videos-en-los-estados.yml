name: dos-videos-en-los-estados

on: push

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ACA + Suplementarios en las 17 paginas (la portada no se toca)
        run: |
          cat > /tmp/dos.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import sys,os,re,json,glob

          SALTAR={"index.html","guia-medicare-espanol.html","aviso-legal.html",
                  "politica-de-privacidad.html","terminos-de-mensajes.html"}
          SUPL="guia-seguros-suplementarios-espanol.html"   # no es ACA: nunca lleva enlace al cotizador

          V_ACA=("ACA / Obamacare","video-asesora","poster-asesora","Este a\xf1o el Mercado cambi\xf3")
          V_SUP=("Suplementarios","video-suplementarios","poster-suplementarios","Lo que tu seguro de salud no cubre")

          CARD='''<div class="va-item">
          <p class="va-tag">%s</p>
          <div class="va-card">
          <video class="va-player" controls playsinline preload="none" poster="/%s.jpg">
          <source src="/%s.mp4" type="video/mp4">
          Tu navegador no puede mostrar el video.
          </video>
          </div>
          <p class="va-sub">%s</p>
          </div>'''

          ESTILO='''<style>
          .va-sec{padding:34px 0 16px;background:#16213e}
          .va-wrap{max-width:900px;margin:0 auto;padding:0 20px;text-align:center}
          .va-kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82em;color:#f4c430;margin:0 0 14px}
          .va-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;justify-content:flex-start;-webkit-overflow-scrolling:touch}
          .va-item{flex:0 0 auto;width:250px;scroll-snap-align:center}
          .va-tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.78em;color:#f4c430;margin:0 0 8px}
          .va-card{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(244,196,48,.35);box-shadow:0 12px 40px rgba(0,0,0,.4);background:#000}
          .va-player{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#000}
          .va-sub{color:#c4d2e8;font-size:.92em;line-height:1.45;margin:10px 0 0}
          .va-hint{color:#8fa0b8;font-size:.82em;margin:2px 0 10px}
          .va-cap{max-width:560px;margin:8px auto 14px;color:#c4d2e8;font-size:1.02em;line-height:1.6}
          .va-cta{margin-top:0}
          @media(min-width:760px){.va-rail{overflow:visible;justify-content:center}.va-hint{display:none}}
          </style>'''

          CAP_ACA='&iquest;Quieres que revisemos tu caso antes de renovar? En espa&ntilde;ol y sin costo.'
          CTA_ACA=('<a href="https://enrollsalud.com/q/liliana-vera" class="btn btn-gold">Cotizaci&oacute;n Gratis</a>\n'
                   '<a href="tel:19543947439" class="btn btn-ghost">Llamar (954) 394-7439</a>')
          CAP_SUP='&iquest;Quieres saber cu&aacute;l te conviene? En espa&ntilde;ol y sin costo.'
          CTA_SUP=('<a href="https://wa.me/19543947439" class="btn btn-wa">WhatsApp</a>\n'
                   '<a href="tel:19543947439" class="btn btn-ghost">Llamar (954) 394-7439</a>')

          def bloque(f):
              vids = [V_SUP,V_ACA] if f==SUPL else [V_ACA,V_SUP]
              cap,cta = (CAP_SUP,CTA_SUP) if f==SUPL else (CAP_ACA,CTA_ACA)
              tarjetas="\n".join(CARD%(t,p,n,d) for t,n,p,d in vids)
              return ('<!-- VIDEO-ASESORA-v1 inicio -->\n<section class="va-sec">\n'+ESTILO+
                      '\n<div class="va-wrap">\n<p class="va-kick">M&iacute;ranos en 10 segundos</p>\n'
                      '<div class="va-rail">\n'+tarjetas+'\n</div>\n'
                      '<p class="va-hint">&#8592; desliza para ver los dem&aacute;s &#8594;</p>\n'
                      '<p class="va-cap">'+cap+'</p>\n<div class="cta-row va-cta">\n'+cta+'\n</div>\n'
                      '</div>\n</section>\n<!-- VIDEO-ASESORA-v1 fin -->')

          for req in ("video-asesora.mp4","poster-asesora.jpg","video-suplementarios.mp4","poster-suplementarios.jpg"):
              if not os.path.exists(req):
                  print("FALTA %s. No se toca nada."%req); sys.exit(1)

          A="<!-- VIDEO-ASESORA-v1 inicio -->"
          B="<!-- VIDEO-ASESORA-v1 fin -->"
          cambiadas=0; iguales=0; detalle=[]

          for f in sorted(glob.glob("*.html")):
              if f in SALTAR: continue
              s=open(f,encoding="utf-8").read()
              i=s.find(A)
              if i<0: print("sin bloque de video, omitida:",f); continue
              j=s.find(B,i)
              if j<0: print("bloque a medias en %s. No se toca nada."%f); sys.exit(1)
              j+=len(B)
              out=s[:i]+bloque(f)+s[j:]

              err=[]
              if out.count(A)!=1 or out.count(B)!=1: err.append("bloque duplicado")
              if out.count("<video")!=2 or out.count("</video>")!=2: err.append("no quedaron 2 videos")
              if out.count("<section")!=out.count("</section>"): err.append("<section> desbalanceado")
              if out.count("<div")!=out.count("</div>"): err.append("<div> desbalanceado")
              if 'id="te-llamamos"' not in out: err.append("se perdio el formulario")
              if out.count("BLOQUE-TE-LLAMAMOS-v1")<3: err.append("se toco el bloque Te-Llamamos")
              if "emailjs" not in out: err.append("se perdio EmailJS")
              if f==SUPL:
                  if "enrollsalud.com/q/" in out.split(A)[1].split(B)[0]: err.append("cotizador en suplementarios (no va)")
                  if out.find("video-suplementarios.mp4")>out.find("video-asesora.mp4"): err.append("en suplementarios el video suyo debe ir primero")
              else:
                  if "enrollsalud.com/q/" not in out.split(A)[1].split(B)[0]: err.append("falta el boton del cotizador")
                  if out.find("video-asesora.mp4")>out.find("video-suplementarios.mp4"): err.append("en paginas ACA el de ACA va primero")
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',out,re.S):
                  try: json.loads(m.group(1))
                  except Exception as e: err.append("JSON-LD roto: %s"%e)
              if err:
                  print("!!! PROBLEMAS en %s, NO SE PUBLICA NADA:"%f)
                  for e in err: print("   -",e)
                  sys.exit(1)

              if out==s: iguales+=1; continue
              open(f,"w",encoding="utf-8").write(out)
              cambiadas+=1; detalle.append("%s: %s"%(f,"suplementarios + ACA" if f==SUPL else "ACA + suplementarios"))

          # la portada NO se toca: tiene su propia vitrina de 3
          idx=open("index.html",encoding="utf-8").read()
          if idx.count("<video")!=4: print("OJO: la portada cambio (no deberia tener 4 videos). Revisar."); sys.exit(1)

          for d in detalle: print(d)
          print("---")
          print("paginas actualizadas:",cambiadas,"| ya estaban:",iguales)
          print("portada intacta con sus 4 videos.")
          if cambiadas==0: print("nada que cambiar")

          PYEOF
          python3 /tmp/dos.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dos-videos-en-los-estados.yml
          git add -A
          git diff --cached --quiet && echo "nada que publicar" && exit 0
          git commit -m "Videos de ACA y suplementarios en las paginas de estado y guias"
          git push
