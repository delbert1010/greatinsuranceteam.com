name: numeros-brillan
on:
  push:
    paths:
      - ".github/workflows/numeros-brillan.yml"
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hacer que brillen los numeros 01 al 04
        run: |
          cat > /tmp/numeros.py <<'PYEOF'
          import re, json, sys
          MARK = "DISENO-MODERNO-v2"
          h = open("index.html", encoding="utf-8").read()
          if MARK in h:
              print("ya estaba aplicado"); sys.exit(0)
          orig = h
          A = "@media (prefers-reduced-motion:reduce){.gm-ring"
          B = "}catch(e){}})();\n</script>\n<!-- DISENO-MODERNO-v1 fin -->"
          assert h.count(A) == 1 and h.count(B) == 1, "no encontre el bloque del diseno"
          CSS = ("/* DISENO-MODERNO-v2 numeros */\n"
                 ".wi-num{transition:color .35s,text-shadow .35s,transform .35s}\n"
                 ".wi h4{transition:color .35s}\n"
                 ".wi:hover .wi-num,.wi.gm-lit .wi-num{color:#f7c858;text-shadow:0 0 18px rgba(247,200,88,.65),0 0 3px #fff3cf;transform:scale(1.12)}\n"
                 ".wi:hover h4,.wi.gm-lit h4{color:#fff}\n")
          JS = ("if(!fine&&'IntersectionObserver' in window){var wo=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('gm-lit',e.isIntersecting);});},{rootMargin:'-45% 0px -45% 0px'});"
                "document.querySelectorAll('.wi').forEach(function(el){wo.observe(el);});}\n")
          h = h.replace(A, CSS + A).replace(B, JS + B)
          for blk in re.findall(r'<script type="application/ld\+json">([\s\S]*?)</script>', h):
              json.loads(blk)
          assert h.count('class="wi"') == orig.count('class="wi"') == 4
          assert len(h) - len(orig) == len(CSS) + len(JS)
          open("index.html", "w", encoding="utf-8").write(h)
          print("OK", len(orig), "->", len(h))

          PYEOF
          echo "fcbaf634d4020308c78f04d21478aba976fe46f13dcfee4f92250b3923e70227  /tmp/numeros.py" | sha256sum -c -
          python3 /tmp/numeros.py
      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/numeros-brillan.yml
          rm -f .github/workflows/numeros-brillan.yml
          git add index.html
          git commit -m "Portada: los numeros 01-04 brillan al pasar el mouse"
          git push
