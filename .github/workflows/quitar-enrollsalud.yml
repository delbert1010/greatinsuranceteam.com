name: quitar-enrollsalud
on:
  push:
    paths:
      - ".github/workflows/quitar-enrollsalud.yml"
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar EnrollSalud de la pagina
        run: |
          cat > /tmp/quitar.py <<'PYEOF'
          import re, json, sys, glob

          MARK = "COTIZADOR-EXTERNO-QUITADO-v1"
          idx = open("index.html", encoding="utf-8").read()
          if MARK in idx:
              print("ya estaba aplicado, no se toca nada"); sys.exit(0)

          def rd(p): return open(p, encoding="utf-8").read()
          def wr(p, s): open(p, "w", encoding="utf-8").write(s)
          def rep(s, a, b, n, where):
              c = s.count(a)
              assert c == n, "%s: esperaba %d de [%s] y hay %d" % (where, n, a[:70], c)
              return s.replace(a, b)

          BTN = 'href="https://enrollsalud.com/q/liliana-vera"'
          LEGALES = ["aviso-legal.html", "politica-de-privacidad.html", "terminos-de-mensajes.html"]
          ACA = ["arizona.html", "carolina-del-norte.html", "carolina-del-sur.html", "georgia.html",
                 "oklahoma.html", "tennessee.html", "texas.html", "guia-aca-espanol.html",
                 "guia-cambios-aca-2027-espanol.html"] + ["guia-aca-%s.html" % e for e in
                 ["arizona", "carolina-del-norte", "carolina-del-sur", "georgia", "oklahoma", "tennessee", "texas"]]

          # 1) Botones "Cotizacion Gratis": ahora llevan al formulario "Te llamamos" de la misma pagina
          for p in ACA:
              s = rd(p)
              assert s.count('id="te-llamamos"') == 1, p + " no tiene el formulario Te llamamos"
              wr(p, rep(s, BTN, 'href="#te-llamamos"', 4, p))
          for p in LEGALES:
              wr(p, rep(rd(p), BTN, 'href="https://greatinsuranceteam.com/#te-llamamos"', 1, p))

          # 2) Portada
          s = idx
          s = rep(s, '"url": "https://www.enrollsalud.com/q/liliana-vera"',
                  '"url": "https://greatinsuranceteam.com/#te-llamamos"', 1, "index schema url")
          s = rep(s, '"https://www.instagram.com/greatinsuranceteam",\n        "https://www.enrollsalud.com/q/liliana-vera"\n',
                  '"https://www.instagram.com/greatinsuranceteam"\n', 1, "index sameAs")
          s = rep(s, "llama al (954) 394-7439 o cotiza en línea en enrollsalud.com/q/liliana-vera.",
                  "llama al (954) 394-7439 o déjanos tu número en esta página y te llamamos.", 2, "index FAQ")
          s = rep(s, "Elige la cobertura que te interesa. Para ACA, continuarás al consentimiento firmado antes de cotizar. Para las demás opciones, puedes solicitar una llamada de nuestro equipo.",
                  "Elige la cobertura que te interesa y déjanos tus datos. Un agente licenciado te llama, en español, para revisar tus opciones.", 1, "index contacto")
          panel = re.compile(r'        <div id="aca-panel" class="aca-panel" hidden>\n[\s\S]*?\n        </div>\n(?=        <fieldset id="lead-fields")')
          assert len(panel.findall(s)) == 1, "no encontre el panel de EnrollSalud"
          s = panel.sub("", s)
          s = rep(s, ' o <a href="https://www.enrollsalud.com/q/liliana-vera">continuar al consentimiento ACA</a>', '', 1, "index noscript")
          s = rep(s, '<script src="/lead-form.js" defer></script>', '<script src="/lead-form.js?v=2" defer></script>', 1, "index script")
          s = rep(s, "</body>", "<!-- %s -->\n</body>" % MARK, 1, "index marca")
          wr("index.html", s)

          # 3) Formulario de la portada: ACA ahora pide nombre y telefono como las demas coberturas
          j = rd("lead-form.js")
          j = rep(j, "  const acaPanel = document.getElementById('aca-panel');\n  const acaLink = document.getElementById('aca-continue');\n", "", 1, "js vars")
          j = re.sub(r"  function updateAgentLink\(\) \{\n[\s\S]*?\n  \}\n", "  function updateAgentLink() {}\n", j, count=1)
          j = rep(j, "    const isACA = service.value === ACA;\n", "", 1, "js isACA")
          j = rep(j, "const showContact = Boolean(service.value) && !isACA;", "const showContact = Boolean(service.value);", 1, "js showContact")
          j = rep(j, "    acaPanel.hidden = !isACA;\n", "", 1, "js panel")
          j = rep(j, "    // ACA is handled only by its explicit link to the signed-consent flow.\n    if (!service.value || service.value === ACA) {\n      (service.value === ACA ? acaLink : service).focus();\n      return;\n    }\n",
                  "    if (!service.value) {\n      service.focus();\n      return;\n    }\n", 1, "js submit")
          assert "acaLink" not in j and "acaPanel" not in j and "isACA" not in j
          wr("lead-form.js", j)

          # 4) Archivo que leen las IA
          t = rd("llms.txt")
          t = rep(t, "Las cotizaciones comienzan con el consentimiento firmado en EnrollSalud.",
                  "Para cotizar, la persona deja su nombre y teléfono en https://greatinsuranceteam.com/#te-llamamos o llama al +1 954 394 7439.", 1, "llms")
          t = rep(t, "- [Consentimiento y cotización ACA con Liliana Vera](https://www.enrollsalud.com/q/liliana-vera).\n- [Consentimiento y cotización ACA con Delbert Useches](https://www.enrollsalud.com/q/delbert).\n", "", 1, "llms enlaces")
          wr("llms.txt", t)

          # 5) Revision final: si algo falla, no se publica nada
          for p in glob.glob("*.html") + ["lead-form.js", "llms.txt"]:
              c = rd(p)
              assert "enrollsalud" not in c.lower(), "queda EnrollSalud en " + p
              for blk in re.findall(r'<script type="application/ld\+json">([\s\S]*?)</script>', c):
                  json.loads(blk)
          s = rd("index.html")
          for key in ['id="lead-form"', 'id="lead-fields"', 'id="f-svc"', 'id="te-llamamos"', "service_jjg4int", "DISENO-MODERNO-v2", "VIDEO-BIENVENIDA-v1"]:
              assert key in s, "falta " + key
          assert "aca-continue" not in s and 'id="aca-panel"' not in s
          print("OK: EnrollSalud quitado de", len(ACA) + len(LEGALES) + 1, "paginas, el formulario y llms.txt")

          PYEOF
          echo "f87524d61a0f539bfdee0d532f6383fe65708dea31e1b92432e7291868e770f8  /tmp/quitar.py" | sha256sum -c -
          python3 /tmp/quitar.py
          node --check lead-form.js
      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/quitar-enrollsalud.yml
          rm -f .github/workflows/quitar-enrollsalud.yml
          git add -A
          git commit -m "Quitar EnrollSalud: los botones de cotizar llevan al formulario Te llamamos"
          git push
