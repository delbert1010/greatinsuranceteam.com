name: Limpiar carpeta sobrante

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Borrar carpeta duplicada
        run: |
          set -e
          rm -rf SUBIR-CTA-ENROLLSALUD
          rm -f .github/workflows/limpiar-carpeta.yml
          ls

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Quitar carpeta duplicada subida por error"
          git push
