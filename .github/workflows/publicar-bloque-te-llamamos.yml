# Publica el bloque "Te Llamamos" (captacion de nombre + telefono) en 19 paginas.
# Corre solo al hacer commit, valida todo, y se borra a si mismo al terminar.
name: publicar-bloque-te-llamamos
on: push
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar bloque y publicar
        run: |
          set -u
          W=.github/workflows/publicar-bloque-te-llamamos.yml
          mkdir -p /tmp/tll
          cat > /tmp/tll/patch.py <<'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Inserta el bloque de captación "Te Llamamos" (nombre + teléfono → EmailJS)
          en las páginas de contenido de greatinsuranceteam.com.

          Reglas de seguridad:
          - Cada inserción usa un ancla que debe aparecer EXACTAMENTE 1 vez en el archivo.
          - Si cualquier ancla falla, NO se escribe nada (aborta todo el lote).
          - index.html: solo inserciones ancladas; la línea base64 de 200KB no se toca.
          - Idempotente: si una página ya tiene el bloque, se aborta con aviso.
          """
          import sys, io, os

          REPO = sys.argv[1] if len(sys.argv) > 1 else "."

          MARK = "BLOQUE-TE-LLAMAMOS-v1"

          # ---------------------------------------------------------------- plantillas
          BLOCK = """
          <!-- {mark} inicio -->
          <section class="tll" id="te-llamamos">
          <style>
          .tll{{padding:56px 20px;background:linear-gradient(135deg,rgba(244,196,48,.10),rgba(244,196,48,.03));border-top:1px solid rgba(244,196,48,.35);border-bottom:1px solid rgba(244,196,48,.35);scroll-margin-top:80px;font-family:'Barlow',sans-serif}}
          .tll-wrap{{max-width:640px;margin:0 auto;text-align:center}}
          .tll-kicker{{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85em;color:var(--gold3,#f4c430);margin:0 0 10px}}
          .tll h2{{font-family:'Playfair Display',serif;font-size:1.9em;line-height:1.25;color:#fff;margin:0 0 12px}}
          .tll h2 em{{color:var(--gold3,#f4c430);font-style:normal}}
          .tll-sub{{color:#dfe6f3;font-size:1.06em;line-height:1.6;max-width:560px;margin:0 auto 16px}}
          .tll-proof{{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none}}
          .tll-proof li{{font-size:.85em;color:#f0e6c8;border:1px solid rgba(244,196,48,.35);border-radius:50px;padding:6px 14px;background:rgba(0,0,0,.15)}}
          .tll-urg{{font-size:.95em;color:#f0e6c8;background:rgba(244,196,48,.10);border-left:3px solid var(--gold3,#f4c430);border-radius:8px;padding:10px 14px;margin:0 auto 20px;max-width:520px;text-align:left}}
          .tll-form{{display:flex;flex-direction:column;gap:12px;max-width:440px;margin:0 auto;text-align:left}}
          .tll-form input[type=text],.tll-form input[type=tel]{{width:100%;padding:15px 16px;border-radius:10px;border:1px solid rgba(244,196,48,.45);background:rgba(255,255,255,.06);color:#fff;font-family:'Barlow',sans-serif;font-size:1.05em;box-sizing:border-box}}
          .tll-form input::placeholder{{color:#9fb0c9}}
          .tll-form input:focus{{outline:2px solid var(--gold3,#f4c430);background:rgba(255,255,255,.09)}}
          .tll-consent{{display:flex;gap:10px;align-items:flex-start;font-size:.8em;color:#c4d2e8;line-height:1.5}}
          .tll-consent input{{margin-top:3px;width:16px;height:16px;flex:none;accent-color:#f4c430}}
          .tll-consent a{{color:var(--gold3,#f4c430);text-decoration:underline}}
          .tll-btn{{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:1.05em;background:linear-gradient(135deg,var(--gold3,#f4c430),var(--gold2,#e8a828));color:#1a1a2e;border:none;border-radius:50px;padding:16px 26px;cursor:pointer;transition:transform .15s ease}}
          .tll-btn:hover{{transform:translateY(-2px)}}
          .tll-btn[disabled]{{opacity:.6;cursor:wait;transform:none}}
          .tll-note{{font-size:.8em;color:#9fb0c9;text-align:center;margin:2px 0 0}}
          .tll-note strong{{color:#dfe6f3}}
          .tll-err{{display:none;color:#ffb4a2;font-size:.92em;text-align:center;margin:4px 0 0}}
          .tll-err a{{color:#25D366}}
          .tll-ok{{display:none;max-width:440px;margin:0 auto;text-align:center;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.4);border-radius:14px;padding:26px 22px;color:#eafff2;font-size:1.02em;line-height:1.6}}
          .tll-ok strong{{color:#fff}}
          .tll-ok a{{display:inline-block;margin-top:14px;background:#25D366;color:#fff;border-radius:50px;padding:12px 22px;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.9em}}
          .tllbar{{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#1a1a2e;border-top:2px solid var(--gold3,#f4c430);padding:10px 12px;display:none;align-items:center;gap:10px;justify-content:center;box-shadow:0 -6px 24px rgba(0,0,0,.45);font-family:'Barlow',sans-serif}}
          .tllbar.on{{display:flex}}
          .tllbar p{{margin:0;color:#fff;font-size:.9em;line-height:1.3}}
          .tllbar a{{flex:none;background:linear-gradient(135deg,var(--gold3,#f4c430),var(--gold2,#e8a828));color:#1a1a2e;border-radius:50px;padding:10px 18px;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85em}}
          .tllbar button{{flex:none;background:none;border:none;color:#9fb0c9;font-size:1.3em;line-height:1;cursor:pointer;padding:4px 8px}}
          @media(max-width:640px){{.tll h2{{font-size:1.45em}}.tllbar p{{font-size:.78em}}}}
          </style>
          <div class="tll-wrap">
          <p class="tll-kicker">Te llamamos gratis</p>
          <h2>{headline}</h2>
          <p class="tll-sub">{sub}</p>
          <ul class="tll-proof"><li>&#11088; 5.0 en Google</li><li>+500 familias protegidas</li><li>Agentes licenciados en espa&ntilde;ol</li></ul>
          <p class="tll-urg">{urg}</p>
          <form class="tll-form" id="tll-form" novalidate>
          <input type="text" id="tll-nom" name="nombre" autocomplete="name" maxlength="100" placeholder="Tu nombre" required>
          <input type="tel" id="tll-tel" name="telefono" autocomplete="tel" inputmode="tel" maxlength="25" placeholder="Tu tel&eacute;fono &mdash; (954) 555-0123" required>
          <label class="tll-consent"><input type="checkbox" id="tll-consent" required><span id="tll-consent-text">Acepto que un agente licenciado de Great Insurance Team me llame o me escriba (llamada, texto o WhatsApp) a este n&uacute;mero para darme esta informaci&oacute;n. No es una inscripci&oacute;n, ni una autorizaci&oacute;n ACA, ni un Scope of Appointment de Medicare. Aplican los <a href="https://greatinsuranceteam.com/terminos-de-mensajes.html" target="_blank" rel="noopener">T&eacute;rminos de Mensajes</a>.</span></label>
          <button type="submit" class="tll-btn" id="tll-btn">Quiero que me llamen &rarr;</button>
          <p class="tll-note">Sin spam y sin compromiso. Te llamaremos del <strong>(954)&nbsp;394-7439</strong>.</p>
          <p class="tll-err" id="tll-err" role="alert">No se pudo enviar. Int&eacute;ntalo de nuevo, o escr&iacute;benos directo por <a href="https://wa.me/19543947439">WhatsApp</a>.</p>
          </form>
          <div class="tll-ok" id="tll-ok" tabindex="-1">
          <p><strong>&iexcl;Listo! Recibimos tu n&uacute;mero.</strong> Te llamaremos del <strong>(954) 394-7439</strong> &mdash; gu&aacute;rdalo en tus contactos para reconocer la llamada.</p>
          <a href="https://wa.me/19543947439">&iquest;Prefieres ahora? Escr&iacute;benos por WhatsApp</a>
          </div>
          </div>
          </section>
          <!-- {mark} fin -->
          """

          BAR_HTML = """
          <!-- {mark} barra -->
          <div class="tllbar" id="tllbar" role="region" aria-label="Te llamamos gratis">
          <p>{bar}</p>
          <a href="#te-llamamos">D&eacute;janos tu n&uacute;mero</a>
          <button type="button" id="tllbar-x" aria-label="Cerrar esta barra">&times;</button>
          </div>"""

          SCRIPT = """
          {sdk}<script>
          (function(){{
          'use strict';
          var SVC='service_jjg4int',TPL='template_tndcul8',KEY='LBujJVV30d-1EIuM1';
          var COB='{cobertura}',ORI='{origen}',CV='te-llamamos-2026-09-12-v1',BTXT='Quiero que me llamen \\u2192';
          var form=document.getElementById('tll-form');if(!form)return;
          var nom=document.getElementById('tll-nom'),tel=document.getElementById('tll-tel'),chk=document.getElementById('tll-consent'),btn=document.getElementById('tll-btn'),err=document.getElementById('tll-err'),ok=document.getElementById('tll-ok'),bar=document.getElementById('tllbar'),barx=document.getElementById('tllbar-x'),sec=document.getElementById('te-llamamos');
          var sending=false,sent=false,closed=false;
          try{{closed=sessionStorage.getItem('tllbar')==='x';}}catch(e){{}}
          try{{if(window.emailjs&&!window.__tllInit){{emailjs.init({{publicKey:KEY}});window.__tllInit=true;}}}}catch(e){{}}
          function reset(){{sending=false;btn.disabled=false;btn.textContent=BTXT;}}
          function fail(){{reset();err.style.display='block';}}
          form.addEventListener('input',function(ev){{if(ev.target&&ev.target.setCustomValidity)ev.target.setCustomValidity('');}});
          form.addEventListener('submit',function(ev){{
          ev.preventDefault();
          if(sending||sent)return;
          nom.setCustomValidity(nom.value.trim()?'':'Escribe tu nombre.');
          var d=tel.value.replace(/\\D/g,'');
          tel.setCustomValidity(/^(?:1)?\\d{{10}}$/.test(d)?'':'Escribe un tel\\u00e9fono de EE. UU. de 10 d\\u00edgitos, con c\\u00f3digo de \\u00e1rea.');
          if(!form.reportValidity())return;
          if(!chk.checked)return;
          var now=new Date();
          var params={{
          cliente_nombre:nom.value.trim(),
          cliente_telefono:tel.value.trim(),
          cliente_email:'No proporcionado',
          cobertura:COB,
          agente_preferido:'Liliana Vera',
          mensaje:['LEAD R\\u00c1PIDO \\u2014 pidi\\u00f3 que lo llamen (bloque Te Llamamos)','','Origen: '+ORI,'Permiso de contacto: '+CV,'Fecha del permiso (UTC): '+now.toISOString(),'Texto aceptado: '+document.getElementById('tll-consent-text').textContent.replace(/\\s+/g,' ').trim(),'Solicitud de contacto \\u00fanicamente. No es autorizaci\\u00f3n ACA, inscripci\\u00f3n ni Scope of Appointment de Medicare.'].join('\\n'),
          fecha:now.toLocaleString('es-US',{{timeZone:'America/New_York',dateStyle:'full',timeStyle:'short'}})
          }};
          sending=true;btn.disabled=true;btn.textContent='Enviando\\u2026';err.style.display='none';
          try{{
          if(!window.emailjs||typeof emailjs.send!=='function')throw new Error('mail-unavailable');
          emailjs.send(SVC,TPL,params).then(function(r){{
          reset();
          if(r&&typeof r.status==='number'&&r.status>=200&&r.status<300){{sent=true;form.style.display='none';ok.style.display='block';if(bar)bar.classList.remove('on');try{{ok.focus();}}catch(e){{}}}}
          else{{err.style.display='block';}}
          }},fail);
          }}catch(e){{fail();}}
          }});
          function inview(){{if(!sec)return false;var r=sec.getBoundingClientRect();return r.top<window.innerHeight&&r.bottom>0;}}
          function onscroll(){{if(!bar)return;if(closed||sent){{bar.classList.remove('on');return;}}bar.classList.toggle('on',window.scrollY>500&&!inview());}}
          window.addEventListener('scroll',onscroll,{{passive:true}});
          if(barx)barx.addEventListener('click',function(){{closed=true;bar.classList.remove('on');try{{sessionStorage.setItem('tllbar','x');}}catch(e){{}}}});
          }})();
          </script>
          <!-- {mark} script fin -->
          """

          SDK_TAG = '<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>\n'

          ACA_PANEL_LINK = ('\n          <p class="form-help" style="margin-top:0;margin-bottom:1rem">'
                            '&iquest;Prefieres que mejor te llamemos y lo revisemos juntos por tel&eacute;fono? '
                            '<a href="#te-llamamos" style="color:var(--gold3);text-decoration:underline">'
                            'D&eacute;janos tu nombre y tu n&uacute;mero aqu&iacute; &rarr;</a></p>')

          # ---------------------------------------------------------------- variantes
          ACA = dict(
              headline='Muchas familias pagan <em>$0 al mes</em> por su seguro m&eacute;dico. &iquest;La tuya tambi&eacute;n?',
              sub='D&eacute;janos tu nombre y tu n&uacute;mero. Liliana te llama en espa&ntilde;ol, calcula tu subsidio gratis y te dice cu&aacute;nto pagar&iacute;as seg&uacute;n tu ingreso. Sin compromiso &mdash; t&uacute; decides.',
              urg='&#9200; La inscripci&oacute;n para 2027 abre el <strong>1 de noviembre</strong> y este a&ntilde;o piden m&aacute;s requisitos y papeles. Prepararte antes te da ventaja.',
              bar='&iquest;Calificas para un plan de $0/mes? Te llamamos gratis y te lo decimos.',
              cobertura='Seguro de Salud (ACA)')

          CAMBIOS = dict(
              headline='Las reglas del Obamacare <em>cambian en 2027</em>. &iquest;Te afectan a ti?',
              sub='D&eacute;janos tu nombre y tu n&uacute;mero. Liliana te llama en espa&ntilde;ol, revisa tu caso y te dice qu&eacute; te cambia y qu&eacute; opciones tienes. Gratis y sin compromiso.',
              urg='&#9200; La inscripci&oacute;n para 2027 abre el <strong>1 de noviembre</strong> y este a&ntilde;o piden m&aacute;s requisitos y papeles. Prepararte antes te da ventaja.',
              bar='&iquest;Los cambios del 2027 te afectan? Te llamamos gratis y te lo decimos.',
              cobertura='Seguro de Salud (ACA)')

          MEDICARE = dict(
              headline='&iquest;Cumples 65 pronto o ya tienes <em>Medicare</em>?',
              sub='D&eacute;janos tu nombre y tu n&uacute;mero. Un agente licenciado te llama en espa&ntilde;ol, revisa tus fechas y tus opciones, y te dice con honestidad si te conviene cambiar o quedarte donde est&aacute;s. Gratis y sin compromiso.',
              urg='&#9200; Del <strong>15 de octubre al 7 de diciembre</strong> puedes cambiar tu plan de Medicare para 2027. Revisar tus opciones antes te da ventaja.',
              bar='Medicare en espa&ntilde;ol: te llamamos gratis y revisamos tus opciones.',
              cobertura='Medicare Advantage')

          SUPL = dict(
              headline='Protecci&oacute;n que te paga <em>en efectivo</em> cuando m&aacute;s lo necesitas.',
              sub='D&eacute;janos tu nombre y tu n&uacute;mero. Liliana te llama en espa&ntilde;ol y te explica c&oacute;mo funcionan los seguros de c&aacute;ncer, accidentes y hospitalizaci&oacute;n &mdash; y cu&aacute;nto costar&iacute;a proteger a tu familia. Sin compromiso.',
              urg='Estos seguros complementan tu plan m&eacute;dico: pagan dinero directo a ti, para los gastos que el seguro m&eacute;dico no cubre.',
              bar='Seguros que pagan en efectivo: te llamamos y te lo explicamos gratis.',
              cobertura='Seguros Suplementarios (C&aacute;ncer, Accidentes, Enfermedades Cr&iacute;ticas)')

          PAGES = {
              'texas.html': ACA, 'georgia.html': ACA, 'tennessee.html': ACA,
              'arizona.html': ACA, 'oklahoma.html': ACA,
              'carolina-del-norte.html': ACA, 'carolina-del-sur.html': ACA,
              'guia-aca-espanol.html': ACA,
              'guia-aca-texas.html': ACA, 'guia-aca-georgia.html': ACA,
              'guia-aca-tennessee.html': ACA, 'guia-aca-arizona.html': ACA,
              'guia-aca-oklahoma.html': ACA,
              'guia-aca-carolina-del-norte.html': ACA,
              'guia-aca-carolina-del-sur.html': ACA,
              'guia-cambios-aca-2027-espanol.html': CAMBIOS,
              'guia-medicare-espanol.html': MEDICARE,
              'guia-seguros-suplementarios-espanol.html': SUPL,
          }

          FINAL_ANCHOR = '<section class="final">'
          BODY_ANCHOR = '</body>'
          INDEX_FOOTER_ANCHOR = '\n<footer'
          INDEX_ACA_ANCHOR = ('<a id="aca-continue" class="btn-hero" '
                              'href="https://www.enrollsalud.com/q/liliana-vera">'
                              'Continuar al consentimiento ACA →</a>')


          def die(msg):
              print('ABORTADO: ' + msg)
              sys.exit(1)


          def load(name):
              p = os.path.join(REPO, name)
              with io.open(p, 'r', encoding='utf-8') as f:
                  return p, f.read()


          def check_once(html, anchor, name):
              n = html.count(anchor)
              if n != 1:
                  die('el ancla aparece %d veces (se esperaba 1) en %s: %r' % (n, name, anchor[:60]))


          def build(name, v):
              origen = 'te-llamamos-' + name.replace('.html', '')
              block = BLOCK.format(mark=MARK, headline=v['headline'], sub=v['sub'], urg=v['urg'])
              tail = (BAR_HTML.format(mark=MARK, bar=v['bar'])
                      + SCRIPT.format(mark=MARK, sdk=SDK_TAG,
                                      cobertura=v['cobertura'], origen=origen))
              return block, tail


          def main():
              results = {}

              for name, v in sorted(PAGES.items()):
                  path, html = load(name)
                  if MARK in html:
                      die('%s ya tiene el bloque (idempotencia)' % name)
                  check_once(html, FINAL_ANCHOR, name)
                  check_once(html, BODY_ANCHOR, name)
                  block, tail = build(name, v)
                  html = html.replace(FINAL_ANCHOR, block + '\n' + FINAL_ANCHOR)
                  html = html.replace(BODY_ANCHOR, tail + '\n' + BODY_ANCHOR)
                  results[path] = html

              # index.html — inserciones quirúrgicas, sin SDK duplicado
              path, html = load('index.html')
              if MARK in html:
                  die('index.html ya tiene el bloque (idempotencia)')
              base64_line = max(html.split('\n'), key=len)          # la línea gigante
              check_once(html, INDEX_ACA_ANCHOR, 'index.html')
              check_once(html, INDEX_FOOTER_ANCHOR, 'index.html')
              check_once(html, BODY_ANCHOR, 'index.html')
              v = dict(ACA)
              block = BLOCK.format(mark=MARK, headline=v['headline'], sub=v['sub'], urg=v['urg'])
              # index: sin barra fija (ya tiene su widget flotante .quick-contact) y sin
              # SDK duplicado (ya carga EmailJS); solo bloque + script
              tail = SCRIPT.format(mark=MARK, sdk='',
                                   cobertura=v['cobertura'], origen='te-llamamos-index')
              html = html.replace(INDEX_ACA_ANCHOR, INDEX_ACA_ANCHOR + ACA_PANEL_LINK)
              html = html.replace(INDEX_FOOTER_ANCHOR, '\n' + block + '\n<footer')
              html = html.replace(BODY_ANCHOR, tail + '\n' + BODY_ANCHOR)
              if base64_line not in html:
                  die('la línea base64 del index cambió — no se escribe nada')
              results[path] = html

              for path, html in results.items():
                  before = os.path.getsize(path)
                  with io.open(path, 'w', encoding='utf-8', newline='') as f:
                      f.write(html)
                  print('OK  %s  (+%d bytes)' % (os.path.basename(path),
                                                 os.path.getsize(path) - before))
              print('LISTO: %d páginas parcheadas.' % len(results))


          if __name__ == '__main__':
              main()
          PYEOF
          cat > /tmp/tll/verify.py <<'VYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Verificación posterior al parche. Sale con código 1 si algo no cuadra."""
          import sys, io, os, glob, json, re, html.parser

          REPO = sys.argv[1] if len(sys.argv) > 1 else "."
          os.chdir(REPO)
          MARK = "BLOQUE-TE-LLAMAMOS-v1"
          PAGES = ['texas.html', 'georgia.html', 'tennessee.html', 'arizona.html',
                   'oklahoma.html', 'carolina-del-norte.html', 'carolina-del-sur.html',
                   'guia-aca-espanol.html', 'guia-aca-texas.html', 'guia-aca-georgia.html',
                   'guia-aca-tennessee.html', 'guia-aca-arizona.html', 'guia-aca-oklahoma.html',
                   'guia-aca-carolina-del-norte.html', 'guia-aca-carolina-del-sur.html',
                   'guia-cambios-aca-2027-espanol.html', 'guia-medicare-espanol.html',
                   'guia-seguros-suplementarios-espanol.html']
          errs = []


          class P(html.parser.HTMLParser):
              VOID = {'meta', 'link', 'br', 'img', 'input', 'hr', 'source', 'area',
                      'base', 'col', 'embed', 'track', 'wbr'}

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.bad = []

              def handle_starttag(self, t, a):
                  if t not in self.VOID:
                      self.stack.append(t)

              def handle_endtag(self, t):
                  if t in self.VOID:
                      return
                  if self.stack and self.stack[-1] == t:
                      self.stack.pop()
                  elif t in self.stack:
                      while self.stack and self.stack[-1] != t:
                          self.stack.pop()
                      self.stack.pop()
                  else:
                      self.bad.append(t)


          def rd(name):
              return io.open(name, encoding='utf-8').read()


          for f in sorted(glob.glob('*.html')):
              src = rd(f)
              if not src.rstrip().endswith('</html>'):
                  errs.append(f + ': no termina en </html> (¿truncado?)')
              p = P()
              try:
                  p.feed(src)
              except Exception as e:
                  errs.append(f + ': parser: %s' % e)
                  continue
              left = [t for t in p.stack if t not in ('html', 'body')]
              if p.bad or left:
                  errs.append(f + ': tags mal cerrados %s %s' % (p.bad[:3], left[:3]))
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', src, re.S):
                  try:
                      json.loads(m.group(1))
                  except Exception as e:
                      errs.append(f + ': JSON-LD roto: %s' % e)

          for f in PAGES:
              src = rd(f)
              for token, n in [('id="te-llamamos"', 1), ('id="tll-form"', 1),
                               ('id="tllbar"', 1), (MARK, 4),
                               ('emailjs/browser@4', 1),
                               ('te-llamamos-' + f.replace('.html', ''), 1)]:
                  if src.count(token) != n:
                      errs.append('%s: %r aparece %d veces (se esperaba %d)'
