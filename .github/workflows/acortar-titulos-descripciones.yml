name: acortar-titulos-descripciones

on: push

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acortar titulos y descripciones
        run: |
          cat > /tmp/metas.py <<'PYEOF'
          import re, sys, os

          # title, description  (title <= 60, description <= 155)
          META = {
          "index.html": (
           "Seguro de Salud en Español en Florida | Great Insurance Team",
           "Agencia de seguros en español en Florida: salud (ACA), Medicare, suplementarios, vida y auto. También preparamos taxes. Asesoría gratuita."),

          "texas.html": (
           "Seguro ACA (Obamacare) en Español en Texas",
           "Seguro de salud ACA en español en Texas, calculado con tu ingreso real, más seguros suplementarios. También preparamos taxes. Asesoría gratuita."),
          "georgia.html": (
           "Seguro ACA (Obamacare) en Español en Georgia",
           "Seguro de salud ACA en español en Georgia, calculado con tu ingreso real, más seguros suplementarios. También preparamos taxes. Asesoría gratuita."),
          "tennessee.html": (
           "Seguro ACA (Obamacare) en Español en Tennessee",
           "Seguro de salud ACA en español en Tennessee, calculado con tu ingreso real, más seguros suplementarios. También preparamos taxes. Asesoría gratuita."),
          "arizona.html": (
           "Seguro ACA (Obamacare) en Español en Arizona",
           "Seguro de salud ACA en español en Arizona, calculado con tu ingreso real, más seguros suplementarios. También preparamos taxes. Asesoría gratuita."),
          "oklahoma.html": (
           "Seguro ACA (Obamacare) en Español en Oklahoma",
           "Seguro de salud ACA en español en Oklahoma, calculado con tu ingreso real, más seguros suplementarios. También preparamos taxes. Asesoría gratuita."),
          "carolina-del-norte.html": (
           "Seguro ACA (Obamacare) en Español en Carolina del Norte",
           "Seguro de salud ACA en español en Carolina del Norte, con tu ingreso real, más suplementarios. También preparamos taxes. Asesoría gratuita."),
          "carolina-del-sur.html": (
           "Seguro ACA (Obamacare) en Español en Carolina del Sur",
           "Seguro de salud ACA en español en Carolina del Sur, con tu ingreso real, más suplementarios. También preparamos taxes. Asesoría gratuita."),

          "guia-aca-texas.html": (
           "Guía 2027 del Obamacare en Texas, en Español",
           "Guía 2027 del seguro ACA en Texas: cómo funciona HealthCare.gov, fechas de inscripción, subsidios y familias de estatus mixto."),
          "guia-aca-georgia.html": (
           "Guía 2027 del Obamacare en Georgia, en Español",
           "Guía 2027 del seguro ACA en Georgia: Georgia Access reemplazó a HealthCare.gov, fechas de inscripción, subsidios y Pathways."),
          "guia-aca-tennessee.html": (
           "Guía 2027 del Obamacare en Tennessee, en Español",
           "Guía 2027 del seguro ACA en Tennessee: cómo funciona HealthCare.gov, fechas de inscripción, TennCare, subsidios y errores comunes."),
          "guia-aca-arizona.html": (
           "Guía 2027 del Obamacare en Arizona, en Español",
           "Guía 2027 del seguro ACA en Arizona: cómo funciona HealthCare.gov, AHCCCS, fechas de inscripción, subsidios y estatus mixto."),
          "guia-aca-oklahoma.html": (
           "Guía 2027 del Obamacare en Oklahoma, en Español",
           "Guía 2027 del seguro ACA en Oklahoma: cómo funciona HealthCare.gov, SoonerCare, fechas de inscripción y subsidios."),
          "guia-aca-carolina-del-norte.html": (
           "Guía 2027 del Obamacare en Carolina del Norte",
           "Guía 2027 del seguro ACA en Carolina del Norte: HealthCare.gov, Medicaid desde 2023, fechas de inscripción y subsidios."),
          "guia-aca-carolina-del-sur.html": (
           "Guía 2027 del Obamacare en Carolina del Sur",
           "Guía 2027 del seguro ACA en Carolina del Sur: HealthCare.gov, Healthy Connections, fechas de inscripción y subsidios."),

          "guia-aca-espanol.html": (
           "Guía del Seguro ACA (Obamacare) en Español 2027",
           "Qué es el seguro ACA, quién califica, cuánto cuesta y cuándo inscribirse — y por qué el ingreso que declaras cuenta en tus taxes."),
          "guia-cambios-aca-2027-espanol.html": (
           "Cambios del Obamacare para 2027, en Español",
           "Quién recibe subsidio desde enero de 2027, verificación de ingresos más estricta, fechas y qué opciones quedan si no calificas."),
          "guia-medicare-espanol.html": (
           "Guía de Medicare en Español 2026",
           "Qué es Medicare, quién califica, cuándo inscribirse y cuánto cuesta en 2026: Partes A, B, C y D, Advantage vs. Original y ayudas."),
          "guia-seguros-suplementarios-espanol.html": (
           "Seguros Suplementarios en Español: Guía 2026",
           "Cáncer, infarto y derrame: qué cubren los seguros suplementarios, cómo te pagan en efectivo y qué hueco llenan en tu seguro médico."),

          "politica-de-privacidad.html": (
           "Política de Privacidad | Great Insurance Team",
           "Cómo recopilamos, usamos y protegemos tu información personal al darte servicios de seguros y preparación de impuestos."),
          "aviso-legal.html": (
           "Aviso Legal | Great Insurance Team",
           "Información sobre la empresa, licencias, avisos de responsabilidad y términos de uso del sitio de Great Insurance Team."),
          "terminos-de-mensajes.html": (
           "Términos de Mensajes SMS | Great Insurance Team",
           "Consentimiento, frecuencia y tarifas de los mensajes de texto; cómo salir con STOP o SALIR y pedir ayuda con HELP o AYUDA."),
          }

          MAXT, MAXD = 60, 155
          cambios, errores = [], []

          for f, (t, d) in sorted(META.items()):
              if len(t) > MAXT: errores.append("%s: titulo nuevo de %d" % (f, len(t)))
              if len(d) > MAXD: errores.append("%s: descripcion nueva de %d" % (f, len(d)))
          if errores:
              print("\n".join(errores)); sys.exit("textos nuevos fuera de limite")

          for f, (t, d) in sorted(META.items()):
              if not os.path.exists(f): sys.exit("ERROR: falta " + f)
              s = open(f, encoding="utf-8").read()
              orig = s

              mt = re.search(r"<title>(.*?)</title>", s, re.S)
              if not mt: sys.exit("ERROR: sin <title> en " + f)
              if mt.group(1) != t:
                  s = s[:mt.start(1)] + t + s[mt.end(1):]

              md = re.search(r'(<meta name="description" content=")([^"]*)(")', s)
              if not md: sys.exit("ERROR: sin meta description en " + f)
              if md.group(2) != d:
                  s = s[:md.start(2)] + d + s[md.end(2):]

              if s != orig:
                  open(f, "w", encoding="utf-8").write(s)
                  cambios.append("%s  (titulo %d, descripcion %d)" % (f, len(t), len(d)))
              else:
                  cambios.append("%s  ya estaba" % f)

          # revision final
          mal = []
          for f in [x for x in os.listdir(".") if x.endswith(".html")]:
              s = open(f, encoding="utf-8").read()
              mt = re.search(r"<title>(.*?)</title>", s, re.S)
              md = re.search(r'<meta name="description" content="([^"]*)"', s)
              if mt and len(mt.group(1)) > MAXT: mal.append("%s: titulo de %d" % (f, len(mt.group(1))))
              if md and len(md.group(1)) > MAXD: mal.append("%s: descripcion de %d" % (f, len(md.group(1))))
              for b in re.findall(r'<script type="application/ld\+json">(.*?)</script>', s, re.S):
                  import json
                  try: json.loads(b)
                  except Exception as e: mal.append("%s: JSON-LD roto" % f)

          print("\n".join("  - " + c for c in cambios))
          if mal:
              print("REVISION FALLIDA:"); print("\n".join("  !! " + m for m in mal)); sys.exit(1)
          print("REVISION OK: ningun titulo >%d ni descripcion >%d en el sitio" % (MAXT, MAXD))

          PYEOF
          python3 /tmp/metas.py

      - name: Publicar y borrar este workflow
        run: |
          rm -f .github/workflows/acortar-titulos-descripciones.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Acortar titulos y descripciones para Google y Bing"
          git push
