name: publicar-todo

on: push

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Video, quitar la promesa de $0, guias 2027 y revision del sitio
        run: |
          cat > /tmp/arreglos.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import os,sys,re,glob,json,datetime

          HOY="2026-09-30"
          SIN_VIDEO={"index.html","guia-medicare-espanol.html","aviso-legal.html","politica-de-privacidad.html","terminos-de-mensajes.html"}
          SIN_COTIZADOR={"guia-seguros-suplementarios-espanol.html"}   # no es ACA, nunca lleva enlace al cotizador
          ESTADOS={"texas.html":"Texas","georgia.html":"Georgia","tennessee.html":"Tennessee",
          "arizona.html":"Arizona","oklahoma.html":"Oklahoma","carolina-del-norte.html":"Carolina del Norte",
          "carolina-del-sur.html":"Carolina del Sur"}
          GUIAS_ESTADO={"guia-aca-texas.html":"Texas","guia-aca-georgia.html":"Georgia","guia-aca-tennessee.html":"Tennessee",
          "guia-aca-arizona.html":"Arizona","guia-aca-oklahoma.html":"Oklahoma",
          "guia-aca-carolina-del-norte.html":"Carolina del Norte","guia-aca-carolina-del-sur.html":"Carolina del Sur"}

          cambios=0; detalle=[]; tocados=set()

          def rep(f,s,old,new,etiqueta):
              global cambios
              if old in s:
                  n=s.count(old); s=s.replace(old,new); cambios+=n
                  detalle.append("%s: %s x%d"%(f,etiqueta,n)); tocados.add(f)
              return s

          # ---------------------------------------------------------------- VIDEO
          VID_CSS='''<!-- VIDEO-ASESORA-v1 inicio -->
          <section class="va-sec">
          <style>
          .va-sec{padding:34px 0 10px;background:#16213e}
          .va-wrap{max-width:820px;margin:0 auto;padding:0 20px}
          .va-kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82em;color:#f4c430;text-align:center;margin:0 0 12px}
          .va-card{position:relative;width:100%;max-width:330px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid rgba(244,196,48,.35);box-shadow:0 12px 40px rgba(0,0,0,.4);background:#000}
          .va-player{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#000}
          .va-cap{max-width:560px;margin:14px auto 12px;text-align:center;color:#c4d2e8;font-size:1.02em;line-height:1.6}
          .va-cta{margin-top:0}
          </style>
          <div class="va-wrap">
          <p class="va-kick">M&iacute;ranos en 10 segundos</p>
          <div class="va-card">
          <video class="va-player" controls playsinline preload="metadata" poster="/poster-asesora.jpg">
          <source src="/video-asesora.mp4" type="video/mp4">
          Tu navegador no puede mostrar el video.
          </video>
          </div>
          <p class="va-cap">@@CAP@@</p>
          <div class="cta-row va-cta">
          @@CTA@@
          </div>
          </div>
          </section>
          <!-- VIDEO-ASESORA-v1 fin -->'''

          CAP_ACA='&iquest;Quieres que revisemos tu caso antes de renovar? En espa&ntilde;ol y sin costo.'
          CTA_ACA=('<a href="https://enrollsalud.com/q/liliana-vera" class="btn btn-gold">Cotizaci&oacute;n Gratis</a>\n'
                   '<a href="tel:19543947439" class="btn btn-ghost">Llamar (954) 394-7439</a>')
          CAP_SUP='&iquest;Quieres saber cu&aacute;l te conviene? En espa&ntilde;ol y sin costo.'
          CTA_SUP=('<a href="https://wa.me/19543947439" class="btn btn-wa">WhatsApp</a>\n'
                   '<a href="tel:19543947439" class="btn btn-ghost">Llamar (954) 394-7439</a>')

          def bloque_video(f):
              cap,cta=(CAP_SUP,CTA_SUP) if f in SIN_COTIZADOR else (CAP_ACA,CTA_ACA)
              return VID_CSS.replace("@@CAP@@",cap).replace("@@CTA@@",cta)

          # ---------------------------------------------------------------- $0
          TLL_H2_OLD='<h2>Muchas familias pagan <em>$0 al mes</em> por su seguro m&eacute;dico. &iquest;La tuya tambi&eacute;n?</h2>'
          TLL_H2_NEW='<h2>Tambi&eacute;n preparamos taxes. Por eso sabemos calcular tu ingreso y tu seguro, <em>para que no tengas problemas en tus pr&oacute;ximos taxes</em>.</h2>'
          TLL_SUB_OLD='<p class="tll-sub">D&eacute;janos tu nombre y tu n&uacute;mero. Liliana te llama en espa&ntilde;ol, calcula tu subsidio gratis y te dice cu&aacute;nto pagar&iacute;as seg&uacute;n tu ingreso. Sin compromiso &mdash; t&uacute; decides.</p>'
          TLL_SUB_NEW='<p class="tll-sub">D&eacute;janos tu nombre y tu n&uacute;mero. Liliana te llama en espa&ntilde;ol, revisa tu ingreso real y te dice cu&aacute;nto pagar&iacute;as. Sin compromiso &mdash; t&uacute; decides.</p>'
          BAR_OLD='<p>&iquest;Calificas para un plan de $0/mes? Te llamamos gratis y te lo decimos.</p>'
          BAR_NEW='<p>Aqu&iacute; hacemos tu seguro <strong>y</strong> tus taxes. Por eso calculamos bien.</p>'

          # ================================================================ PARTE 1: VIDEO
          for req in ("video-asesora.mp4","poster-asesora.jpg"):
              if not os.path.exists(req):
                  print("FALTA %s -- sube primero el video y el poster. No se toca nada."%req); sys.exit(1)
          if os.path.getsize("video-asesora.mp4")<1500000:
              print("video-asesora.mp4 llego truncado. No se toca nada."); sys.exit(1)

          for f in sorted(glob.glob("*.html")):
              if f in SIN_VIDEO: continue
              s=open(f,encoding="utf-8").read()
              if "VIDEO-ASESORA-v1" in s: continue
              i=s.find('<section class="hero">')
              if i<0: print("sin hero, sin video:",f); continue
              j=s.find("</section>",i)
              if j<0: continue
              j+=len("</section>")
              out=s[:j]+"\n\n"+bloque_video(f)+s[j:]
              if out.count("VIDEO-ASESORA-v1")!=2 or out.count("<video")!=1:
                  print("chequeo de video fallido, omitido:",f); continue
              open(f,"w",encoding="utf-8").write(out)
              cambios+=1; tocados.add(f); detalle.append("%s: bloque de video x1"%f)

          # ================================================================ PARTE 2 y 3
          for f in sorted(glob.glob("*.html")):
              s=open(f,encoding="utf-8").read(); orig=s

              s=rep(f,s,TLL_H2_OLD,TLL_H2_NEW,"titulo Te-Llamamos")
              s=rep(f,s,TLL_SUB_OLD,TLL_SUB_NEW,"subtitulo Te-Llamamos")
              s=rep(f,s,BAR_OLD,BAR_NEW,"barra")

              if f in ESTADOS:
                  E=ESTADOS[f]
                  s=rep(f,s,'Seguro de salud ACA (Obamacare) en español en %s desde $0/mes según tu ingreso,'%E,
                            'Seguro de salud ACA (Obamacare) en español en %s calculado con tu ingreso real,'%E,"meta description")
                  s=rep(f,s,'Planes de salud ACA desde $0/mes según tu ingreso y seguros suplementarios en %s. Asesoría 100%% en español y sin costo.'%E,
                            'Planes de salud ACA calculados con tu ingreso real y seguros suplementarios en %s. También preparamos taxes. Asesoría 100%% en español y sin costo.'%E,"og:description")
                  s=rep(f,s,'<p class="lead">Planes de salud desde <strong>$0/mes según tu ingreso</strong>, más <strong>seguros suplementarios</strong>',
                            '<p class="lead">Planes de salud <strong>calculados con tu ingreso real</strong>, más <strong>seguros suplementarios</strong>',"texto del hero")
                  s=rep(f,s,'<!-- PLANES $0 -->','<!-- CUANTO CUESTA -->',"comentario de seccion")
                  s=rep(f,s,'<h2>Planes desde $0/mes según tu ingreso</h2>','<h2>Cuánto pagas depende de tu ingreso real</h2>',"titulo de seccion")
                  s=rep(f,s,'<p>Gracias a los subsidios del Mercado, muchas familias en %s obtienen cobertura de salud pagando muy poco — y en muchos casos <strong>$0 al mes</strong>. El monto exacto depende de tu ingreso y del tamaño de tu familia.</p>'%E,
                            '<p>Los subsidios del Mercado bajan lo que pagas, y cuánto bajan depende de tu ingreso y del tamaño de tu familia. Ese ingreso se revisa después con tus taxes: si quedó mal calculado, la diferencia te la cobran al declarar. Por eso en %s lo calculamos con cuidado desde el principio.</p>'%E,"parrafo de seccion")
                  s=rep(f,s,'<li>Te calculamos tu subsidio <strong>gratis</strong>, sin compromiso.</li>',
                            '<li>Calculamos tu subsidio con tu <strong>ingreso real</strong>, gratis y sin compromiso.</li>\n      <li>También preparamos taxes, así que sabemos cómo termina la cuenta en abril.</li>',"lista de la seccion")
                  s=rep(f,s,'<p>Muchas familias califican para planes desde $0/mes según su ingreso y el tamaño de su familia. Te calculamos tu subsidio gratis para que sepas exactamente cuánto pagarías.</p>',
                            '<p>Depende de tu ingreso y del tamaño de tu familia. Calculamos tu subsidio con tu ingreso real y te decimos cuánto pagarías — y como también preparamos taxes, lo hacemos pensando en tu declaración del año que viene.</p>',"pregunta frecuente")
                  pat=re.compile(r'"text": "Muchas familias en %s califican para planes desde \$0 al mes.*?"'%re.escape(E),re.S)
                  m=pat.search(s)
                  if m:
                      s=s[:m.start()]+('"text": "Depende de tu ingreso y del tamaño de tu familia. Los subsidios del Mercado de Salud bajan lo que pagas, y ese ingreso se reconcilia después con tus taxes. Calculamos tu subsidio con tu ingreso real, gratis, y como también preparamos taxes lo hacemos pensando en tu declaración."')+s[m.end():]
                      cambios+=1; tocados.add(f); detalle.append("%s: datos para las IA (JSON-LD) x1"%f)

              # --- guias por estado: la etiqueta pasa de 2026 a 2027 (el contenido ya habla de la cobertura 2027)
              if f in GUIAS_ESTADO:
                  E=GUIAS_ESTADO[f]
                  s=rep(f,s,'en %s en Español: Guía 2026'%E,'en %s en Español: Guía 2027'%E,"titulo 2027")
                  s=rep(f,s,'en %s en Español: Guía 2026'%E,'en %s en Español: Guía 2027'%E,"og:title 2027")
                  s=rep(f,s,'Guía 2026 del seguro de salud','Guía 2027 del seguro de salud',"descripciones 2027")
                  s=rep(f,s,'en %s en español 2026"'%E,'en %s en español 2027"'%E,"JSON-LD headline 2027")
                  s=rep(f,s,'Guía en Español 2026</h1>','Guía en Español 2027</h1>',"titulo visible 2027")
                  s=rep(f,s,'Datos verificados 2026','Datos verificados para la cobertura 2027',"pie de la guia")
                  s=rep(f,s,'"dateModified": "2026-08-24"','"dateModified": "%s"'%HOY,"fecha de actualizacion")
                  s=rep(f,s,'<meta property="og:title" content="Seguro de Salud en %s en Español: Guía 2026">'%E,
                            '<meta property="og:title" content="Seguro de Salud en %s en Español: Guía 2027">'%E,"og:title 2027")

              if f=="guia-aca-espanol.html":
                  s=rep(f,s,'Guía Completa 2026','Guía Completa 2027',"titulo 2027")
                  s=rep(f,s,'cómo obtener ayuda del gobierno. Muchas familias pagan $0/mes. Asesoría gratuita: (954) 394-7439.',
                            'cómo obtener ayuda del gobierno, y por qué el ingreso que declares cuenta en tus taxes. Asesoría gratuita: (954) 394-7439.',"meta description")
                  s=rep(f,s,'cuándo inscribirte. Muchas familias pagan $0/mes. Asesoría gratuita.',
                            'cuándo inscribirte y cómo afecta tus taxes. Asesoría gratuita.',"og:description")
                  s=rep(f,s,'"text": "El costo depende de tu ingreso, tu edad, tu estado y el plan que elijas. Gracias a los subsidios del gobierno, muchas familias pagan desde $0 al mes. Un agente puede calcular tu subsidio gratis."',
                            '"text": "El costo depende de tu ingreso, tu edad, tu estado y el plan que elijas. Los subsidios del gobierno bajan lo que pagas, pero ese ingreso se reconcilia después con tus taxes. Un agente puede calcular tu subsidio con tu ingreso real, gratis."',"datos para las IA (JSON-LD)")
                  s=rep(f,s,'3. ¿Cuánto cuesta y por qué muchos pagan $0?','3. ¿Cuánto cuesta y cómo se calcula tu subsidio?',"indice y titulo")
                  s=rep(f,s,'<p>Gracias a esos subsidios, <strong>muchas familias terminan pagando desde $0 al mes</strong>. No es magia ni un truco: es la ayuda del gobierno aplicada a tu caso. La única forma de saber tu número exacto es <strong>calcular tu subsidio</strong>, y eso lo hacemos gratis.</p>',
                            '<p>Esos subsidios bajan bastante lo que pagas, pero no son un regalo: se calculan con el ingreso que tú declaras, y el gobierno los revisa después contra tus taxes. Si el ingreso quedó mal puesto, la diferencia te la cobran al declarar. La única forma de saber tu número exacto es <strong>calcular tu subsidio con tu ingreso real</strong>, y eso lo hacemos gratis.</p>',"parrafo del costo")

              if f=="index.html":
                  s=rep(f,s,'Seguros de salud ACA desde $0/mes, Medicare Advantage,','Seguros de salud ACA calculados con tu ingreso real, Medicare Advantage,',"meta description")
                  s=rep(f,s,'"description": "Planes de salud individuales y familiares del Marketplace ACA con créditos tributarios. Muchas familias califican para primas desde $0 al mes. Cubre emergencias, hospitalización y medicina preventiva.",',
                            '"description": "Planes de salud individuales y familiares del Marketplace ACA con créditos tributarios calculados con tu ingreso real. Cubre emergencias, hospitalización y medicina preventiva.",',"datos para las IA (servicio ACA)")
                  s=rep(f,s,'"description": "Asesoría gratuita. Prima desde $0/mes con créditos tributarios."',
                            '"description": "Asesoría gratuita. Créditos tributarios calculados con tu ingreso real."',"datos para las IA (oferta ACA)")
                  s=rep(f,s,'Muchas familias califican para créditos tributarios que reducen la prima a $0 por mes.',
                            'Los créditos tributarios reducen lo que pagas según tu ingreso, y ese ingreso se reconcilia después con tus taxes.',"pregunta frecuente ACA")
                  s=rep(f,s,'Con los créditos tributarios del Marketplace ACA, muchas familias hispanas en Florida pagan desde $0 al mes.',
                            'Con los créditos tributarios del Marketplace ACA, lo que pagas depende de tu ingreso real — y ese mismo ingreso cuenta después en tus taxes.',"pregunta frecuente de costo")

              if f=="aviso-legal.html":
                  s=rep(f,s,'La información y los ejemplos de este sitio (incluyendo referencias a planes "desde $0/mes") dependen',
                            'La información y los ejemplos de este sitio dependen',"descargo legal")

              if s!=orig: open(f,"w",encoding="utf-8").write(s)

          # ================================================================ PARTE 4: sitemap
          sm=open("sitemap.xml",encoding="utf-8").read(); smo=sm
          for f in sorted(tocados):
              loc="https://greatinsuranceteam.com/" + ("" if f=="index.html" else f)
              pat=re.compile(r'(<loc>%s</loc>\s*<lastmod>)[0-9-]+(</lastmod>)'%re.escape(loc))
              sm2=pat.sub(r'\g<1>%s\g<2>'%HOY,sm)
              if sm2!=sm: sm=sm2
          if sm!=smo:
              open("sitemap.xml","w",encoding="utf-8").write(sm)
              detalle.append("sitemap.xml: fechas de actualizacion"); cambios+=1

          # ================================================================ PARTE 5: verificacion
          errores=[]
          PROHIBIDO=["$0/mes","$0 al mes por su seguro","primas desde $0","prima a $0 por mes","pagan desde $0 al mes","planes desde $0"]
          paginas=sorted(glob.glob("*.html"))
          enlaces={}; existentes=set(paginas)
          for f in paginas:
              s=open(f,encoding="utf-8").read()
              # 1) promesas de $0
              if f!="guia-medicare-espanol.html":
                  for p in PROHIBIDO:
                      if p in s and not (f=="guia-cambios-aca-2027-espanol.html" and "expir" in s):
                          errores.append("%s todavia dice %s"%(f,p))
              # 2) JSON-LD valido
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',s,re.S):
                  try: json.loads(m.group(1))
                  except Exception as e: errores.append("%s: JSON-LD roto (%s)"%(f,e))
              # 3) etiquetas balanceadas
              if s.count("<section")!=s.count("</section>"): errores.append("%s: <section> desbalanceado"%f)
              if s.count("<video")!=s.count("</video>"): errores.append("%s: <video> desbalanceado"%f)
              # 4) video donde toca
              if f not in SIN_VIDEO and "VIDEO-ASESORA-v1" not in s: errores.append("%s: se quedo sin video"%f)
              # 5) enlaces internos
              for m in re.finditer(r'href="([^"]+\.html)"',s):
                  d=m.group(1)
                  d=re.sub(r'^https?://(www\.)?greatinsuranceteam\.com/','',d)
                  if d.startswith("http"): continue
                  d=d.lstrip("./")
                  if d==f: continue
                  enlaces.setdefault(d,set()).add(f)
                  if d not in existentes: errores.append("%s: enlace roto a %s"%(f,d))
          # 6) paginas huerfanas
          for f in paginas:
              if f=="index.html": continue
              if not enlaces.get(f): errores.append("%s: PAGINA HUERFANA (nadie la enlaza)"%f)
          # 7) sitemap
          smtxt=open("sitemap.xml",encoding="utf-8").read()
          for f in paginas:
              u = "https://greatinsuranceteam.com/" + ("" if f=="index.html" else f)
              if "<loc>%s</loc>"%u not in smtxt: errores.append("%s: no esta en el sitemap"%f)

          for d in detalle: print(d)
          print("---")
          print("cambios:",cambios,"| paginas tocadas:",len(tocados))
          if errores:
              print("!!! PROBLEMAS, NO SE PUBLICA:")
              for e in errores[:40]: print("   -",e)
              sys.exit(1)
          print("REVISION OK: sin promesas de $0 del ACA, JSON-LD valido, etiquetas balanceadas,")
          print("video en las 17 paginas, 0 enlaces rotos, 0 paginas huerfanas, sitemap completo.")
          if cambios==0: print("nada que cambiar (ya estaba aplicado)")

          PYEOF
          python3 /tmp/arreglos.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publicar-todo.yml
          git add -A
          git diff --cached --quiet && echo "nada que publicar" && exit 0
          git commit -m "Video de la asesora, mensaje seguro+taxes en vez de 0 dolares, guias de estado 2027"
          git push
