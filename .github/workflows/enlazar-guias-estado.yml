name: enlazar-guias-estado
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enlazar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlazar las 7 guias de estado
        run: |
          python3 - <<'PY'
          B='https://greatinsuranceteam.com'
          estados=[("texas","Texas"),("georgia","Georgia"),("tennessee","Tennessee"),("arizona","Arizona"),
                   ("oklahoma","Oklahoma"),("carolina-del-norte","Carolina del Norte"),("carolina-del-sur","Carolina del Sur")]
          ANCLA='<a href="%s/guia-aca-espanol.html" class="btn btn-ghost">Leer la Guia Gratis</a>'%B
          ANCLA=ANCLA.replace('Guia','Gu\u00eda')
          hechos=0
          for slug,nom in estados:
              f=slug+'.html'
              s=open(f,encoding='utf-8').read()
              if ('guia-aca-%s.html'%slug) in s:
                  print('ya estaba:',f); continue
              assert s.count(ANCLA)==1, 'ancla no unica en '+f
              nuevo=('<a href="%s/guia-aca-%s.html" class="btn btn-gold">Gu\u00eda ACA de %s 2027 &rarr;</a>\n      '%(B,slug,nom))+ANCLA
              open(f,'w',encoding='utf-8').write(s.replace(ANCLA,nuevo,1)); hechos+=1
          f='guia-aca-espanol.html'
          s=open(f,encoding='utf-8').read()
          ANC2='    <div class="callout">\n      <p>\U0001F4D8 <strong>\u00bfTienes 65 a\u00f1os'
          if 'guia-aca-texas.html' in s:
              print('ya estaba:',f)
          else:
              assert s.count(ANC2)==1, 'ancla no unica en '+f
              enlaces=' \u00b7 '.join('<a href="%s/guia-aca-%s.html" style="color:#f4c430;text-decoration:underline;">%s</a>'%(B,sl,no) for sl,no in estados)
              bloque=('    <div class="callout">\n'
                      '      <p>\U0001F5FA\uFE0F <strong>Gu\u00eda del ACA en tu estado.</strong> Cada estado tiene sus propias fechas, su propio mercado y sus propias reglas de Medicaid. '
                      'Lee la gu\u00eda de 2027 del tuyo: %s.</p>\n'
                      '    </div>\n'%enlaces)
              open(f,'w',encoding='utf-8').write(s.replace(ANC2,bloque+ANC2,1)); hechos+=1
          f='index.html'
          s=open(f,encoding='utf-8').read()
          ANC3='<li><a href="%s/guia-seguros-suplementarios-espanol.html">Gu\u00eda de Seguros Suplementarios</a></li>'%B
          if 'guia-aca-texas.html' in s:
              print('ya estaba:',f)
          else:
              assert s.count(ANC3)==1, 'ancla no unica en index.html'
              extra=''.join('\n      <li><a href="%s/guia-aca-%s.html">Gu\u00eda ACA %s</a></li>'%(B,sl,no) for sl,no in estados)
              open(f,'w',encoding='utf-8').write(s.replace(ANC3,ANC3+extra,1)); hechos+=1
          assert 'data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD' in open('index.html',encoding='utf-8').read(), 'se dano la imagen base64 del index'
          print('archivos modificados:',hechos)
          PY
      - name: Borrar este workflow y publicar
        run: |
          rm -f .github/workflows/enlazar-guias-estado.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enlazar las 7 guias ACA por estado (eran huerfanas: 0 enlaces entrantes)" || exit 0
          git push
