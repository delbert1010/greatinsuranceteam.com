name: video-junto-a-las-guias

on: push

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mover el video de la asesora justo arriba del bloque de las guias
        run: |
          cat > /tmp/mover.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import sys,os,re,json

          BLOQUE = '''<!-- VIDEO-ASESORA-v1 inicio -->
          <section class="va-sec">
          <style>
          .va-sec{background:#1a1a2e;padding:52px 20px 10px;text-align:center;border-top:1px solid rgba(244,196,48,0.15)}
          .va-wrap{max-width:860px;margin:0 auto}
          .va-kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.86em;color:#f4c430;margin:0 0 14px}
          .va-card{position:relative;width:100%;max-width:320px;margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid rgba(244,196,48,.4);box-shadow:0 16px 50px rgba(0,0,0,.45);background:#000}
          .va-player{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#000}
          .va-cap{max-width:560px;margin:18px auto 18px;color:#c4d2e8;font-size:1.08em;line-height:1.6;font-family:'Barlow',sans-serif}
          .va-cta a{display:inline-block;padding:14px 34px;background:#f4c430;color:#1a1a2e;border-radius:50px;font-weight:700;font-family:'Barlow',sans-serif;font-size:1.05em;text-decoration:none}
          </style>
          <div class="va-wrap">
          <p class="va-kick">Este a&ntilde;o el Mercado cambi&oacute; &mdash; m&iacute;ralo en 10 segundos</p>
          <div class="va-card">
          <video class="va-player" controls playsinline preload="none" poster="/poster-asesora.jpg">
          <source src="/video-asesora.mp4" type="video/mp4">
          Tu navegador no puede reproducir el video.
          </video>
          </div>
          <p class="va-cap">&iquest;Quieres que revisemos tu caso antes de renovar? En espa&ntilde;ol y sin costo.</p>
          <div class="va-cta"><a href="#te-llamamos">D&eacute;janos tu n&uacute;mero</a></div>
          </div>
          </section>
          <!-- VIDEO-ASESORA-v1 fin -->

          '''

          f="index.html"
          s=open(f,encoding="utf-8").read()
          antes=len(s)

          for req in ("video-asesora.mp4","poster-asesora.jpg"):
              if not os.path.exists(req):
                  print("FALTA %s. No se toca nada."%req); sys.exit(1)

          # 1) quitar el bloque de donde este ahora (si esta)
          A="<!-- VIDEO-ASESORA-v1 inicio -->"
          B="<!-- VIDEO-ASESORA-v1 fin -->"
          i=s.find(A)
          if i>=0:
              j=s.find(B,i)
              if j<0:
                  print("bloque de video a medias. No se toca nada."); sys.exit(1)
              j+=len(B)
              while s[j:j+1]=="\n": j+=1
              s=s[:i]+s[j:]

          if A in s:
              print("quedo mas de un bloque de video. No se toca nada."); sys.exit(1)

          # 2) ponerlo justo ANTES de la seccion de las guias
          m=re.search(r'<section [^>]*>\s*<div[^>]*>\s*<h2[^>]*>[^<]*Gu[ií]as Gratis en Espa', s)
          if not m:
              print("no encuentro la seccion de las guias en la portada. No se toca nada."); sys.exit(1)
          k=m.start()
          out=s[:k]+BLOQUE+s[k:]

          err=[]
          if "VIDEO-BIENVENIDA-v1" not in out: err.append("se perdio el video de bienvenida")
          if out.count("VIDEO-ASESORA-v1")!=2: err.append("el bloque nuevo no quedo completo")
          if out.count("<video")!=2 or out.count("</video>")!=2: err.append("no quedaron exactamente 2 videos")
          if out.count("<section")!=out.count("</section>"): err.append("<section> desbalanceado")
          if 'id="te-llamamos"' not in out: err.append("no encuentro el formulario")
          if out.count("BLOQUE-TE-LLAMAMOS-v1")<3: err.append("se toco el bloque Te-Llamamos")
          if "emailjs" not in out: err.append("se perdio EmailJS")
          if out.count("enrollsalud.com/q/")<5: err.append("se perdieron botones del cotizador")
          if "video-bienvenida.mp4" not in out: err.append("se perdio el mp4 de bienvenida")
          if "guia-aca-espanol.html" not in out or "guia-medicare-espanol.html" not in out or "guia-seguros-suplementarios-espanol.html" not in out:
              err.append("se perdio algun boton de las guias")
          if abs(len(out)-antes) > 2500: err.append("el tamano cambio mas de lo esperado (%d)"%(len(out)-antes))
          for mm in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',out,re.S):
              try: json.loads(mm.group(1))
              except Exception as e: err.append("JSON-LD roto: %s"%e)
          # el video tiene que quedar ANTES de los botones de las guias
          mg=re.search(r'<h2[^>]*>[^<]*Gu[i\u00ed]as Gratis en Espa', out)
          if not mg or out.find("VIDEO-ASESORA-v1") > mg.start(): err.append("el video no quedo antes de las guias")
          if err:
              print("!!! PROBLEMAS, NO SE TOCA NADA:")
              for e in err: print("   -",e)
              sys.exit(1)

          if out==open(f,encoding="utf-8").read():
              print("ya estaba en su sitio"); sys.exit(0)
          open(f,"w",encoding="utf-8").write(out)
          print("listo: el video de la asesora quedo JUSTO ARRIBA del bloque de las guias (%d -> %d bytes)"%(antes,len(out)))

          PYEOF
          python3 /tmp/mover.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/video-junto-a-las-guias.yml
          git add -A
          git diff --cached --quiet && echo "nada que publicar" && exit 0
          git commit -m "Video de la asesora junto al bloque de las guias en la portada"
          git push
